<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f1">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="הבית שלנו">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>הבית שלנו</title>
<style>
:root{
  --bg:#f5f3ee;--card:#ffffff;--ink:#1f2a27;--muted:#6f7a76;--faint:#a3aba7;--line:#edeae3;--soft:#f2f0ea;
  --accent:#2f7a68;--accent-2:#4e9f86;--accent-ink:#ffffff;--accent-soft:#e2f1ec;
  --shimon:#4867a8;--shimon-soft:#e8eefa;--aviya:#c25a78;--aviya-soft:#fbeaf0;
  --done:#2f7a68;--warn:#c27c1a;--danger:#c0473a;
  --r:20px;--shadow:0 1px 1px rgba(31,42,39,.03),0 6px 20px -6px rgba(31,42,39,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.4}
body{min-height:100vh;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
.hidden{display:none!important}

/* top */
.top{position:sticky;top:0;z-index:10;background:rgba(247,245,241,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.top-row{display:flex;align-items:center;justify-content:space-between;max-width:640px;margin:0 auto 10px}
.brand{font-weight:800;font-size:21px;letter-spacing:-.2px}
.hello{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.net{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.net.off{background:var(--warn)}
.icon-btn.on{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:var(--card);box-shadow:var(--shadow);font-size:18px;display:grid;place-items:center}
.seg{display:flex;background:#ebe7df;border-radius:14px;padding:4px;gap:4px;max-width:640px;margin:0 auto}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:11px;font-weight:600;font-size:15px;color:var(--muted);transition:background .2s,color .2s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg.small button{padding:8px 6px;font-size:14px}
.seg .badge{display:inline-block;min-width:20px;padding:0 6px;margin-inline-start:6px;border-radius:10px;background:var(--accent);color:#fff;font-size:12px;line-height:20px}
.offline-bar{max-width:640px;margin:8px auto 0;background:#fdf3e1;color:#7a5414;border-radius:10px;padding:7px 12px;font-size:13px;text-align:center}
.test-bar{background:#fff4d6;color:#6b4d00;font-size:12.5px;text-align:center;padding:6px 12px}

main{max-width:640px;margin:0 auto;padding:14px 16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.muted{color:var(--muted)}.small{font-size:13px}
h3.sec{font-size:13px;color:var(--muted);font-weight:700;margin:18px 4px 8px;letter-spacing:.2px}

/* summary */
.sum-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sum-big{font-size:26px;font-weight:800}
.sum-big small{font-size:15px;color:var(--muted);font-weight:600}
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin:10px 0 12px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.people{display:flex;gap:8px;flex-wrap:wrap}
.ptag{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:4px 11px;font-size:13.5px;font-weight:600}
.ptag.shimon{background:var(--shimon-soft);color:var(--shimon)}
.ptag.aviya{background:var(--aviya-soft);color:var(--aviya)}
.ptag.free{background:var(--soft);color:var(--muted)}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 14px;font-size:14px;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* task rows */
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);min-height:62px;transition:background .2s,opacity .25s}
.row:last-child{border-bottom:0}
.row.busy{opacity:.55;pointer-events:none}
.chk{flex:0 0 32px;width:32px;height:32px;border-radius:50%;border:2px solid #d8d2c7;background:none;display:grid;place-items:center;padding:0;transition:all .2s}
.chk svg{width:16px;height:16px;stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.row.done .chk{background:var(--done);border-color:var(--done)}
.row.done .chk svg{opacity:1;transform:scale(1)}
.row.pop .chk{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.rbody{flex:1;min-width:0}
.rname{font-size:16px;font-weight:600;word-wrap:break-word}
.row.done .rname{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1.5px}
.rmeta{font-size:12.5px;color:var(--muted);margin-top:2px}
.ract{display:flex;gap:6px;flex:0 0 auto}
.pill{border:0;border-radius:20px;padding:8px 13px;font-size:14px;font-weight:600;min-height:36px;white-space:nowrap}
.pill.me{background:var(--accent);color:#fff}
.pill.ghost{background:var(--soft);color:var(--muted)}
.pill.shimon{background:var(--shimon-soft);color:var(--shimon)}
.pill.aviya{background:var(--aviya-soft);color:var(--aviya)}
.spin{width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--muted);padding:28px 16px}
.empty .big{font-size:40px;margin-bottom:6px}
.link-btn{border:0;background:none;color:var(--accent);font-weight:600;padding:10px 4px;font-size:15px}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 6px;margin-bottom:14px}
.weekstrip button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0}
.weekstrip .c{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;border:2px solid transparent;transition:all .2s}
.weekstrip small{font-size:11px;color:var(--muted)}
.weekstrip .dot{width:5px;height:5px;border-radius:50%;background:transparent}
.weekstrip .dot.on{background:var(--accent)}
.weekstrip button.today .c{background:var(--accent);color:#fff}
.weekstrip button.sel .c{border-color:var(--accent)}
.weekstrip button.sel:not(.today) .c{color:var(--accent)}
.week-head{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* shopping */
.search{position:relative;margin-bottom:12px}
.search input{width:100%;border:0;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:13px 44px 13px 14px;font-size:16px;outline:none}
.search .ic{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--faint)}
.tools{display:flex;justify-content:space-between;align-items:center;margin:-2px 2px 8px}
.cat{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.cat-h{display:flex;align-items:center;gap:8px;padding:13px 14px;font-weight:700;border:0;background:none;width:100%;text-align:right;font-size:15.5px}
.cat-h .name{flex:1}
.cat-h .cnt{font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:2px 8px}
.cat-h .arrow{color:var(--faint);transition:transform .2s;font-size:13px}
.cat.closed .arrow{transform:rotate(90deg)}
.cat.closed .prods{display:none}
.cat{scroll-margin-top:150px}
.qty{display:flex;align-items:center;gap:2px;margin-left:10px;background:#fdf1df;border-radius:20px;padding:3px}
.qty button{width:30px;height:30px;border-radius:50%;border:0;background:#fff;color:var(--warn);font-size:18px;font-weight:700;display:grid;place-items:center;padding:0;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.qty button:disabled{opacity:.35}
.qty b{min-width:22px;text-align:center;color:var(--warn);font-size:15px}
.qbadge{flex:0 0 auto;min-width:34px;height:34px;border-radius:11px;background:#fdf1df;color:var(--warn);font-weight:800;display:flex;align-items:center;justify-content:center;gap:1px;font-size:15px;padding:0 7px;white-space:nowrap}
.qbadge::before{content:"×";font-size:12px;margin-left:1px;opacity:.7}
.cat-pen{margin-left:12px}
.cat-pen.on{background:var(--accent);color:#fff}
.cat.editing{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.cat-bar{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);background:var(--accent-soft)}
.cat-bar .chip{background:var(--card)}
.cat-bar .chip:disabled{opacity:.4}
.prod{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);min-height:52px;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:right;font-size:15.5px}
.prod .box{flex:0 0 26px;height:26px;border-radius:8px;border:2px solid #d8d2c7;display:grid;place-items:center;transition:all .2s}
.prod .box svg{width:14px;height:14px;stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .2s}
.prod.miss .box{background:var(--warn);border-color:var(--warn)}
.prod.miss .box svg{opacity:1}
.prod .pname{flex:1}
.prod .tag{font-size:12px;color:var(--warn);font-weight:700}
.prod .pend{font-size:11.5px;color:var(--faint)}
.edit-ic{border:0;background:var(--soft);border-radius:10px;width:34px;height:34px;flex:0 0 34px;font-size:15px;display:grid;place-items:center}
.cat-tools{display:flex;gap:6px}
.add-row{border-top:1px solid var(--line)}
.list-head{display:flex;align-items:center;justify-content:space-between}
.list-head .num{font-size:30px;font-weight:800}
.buy-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);min-height:56px;transition:opacity .25s,transform .25s,max-height .3s;max-height:90px}
.buy-row.gone{opacity:0;transform:translateX(-30px)}
.buy-row .pname{flex:1;font-size:16px;font-weight:600}
.buy-btn{border:0;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-weight:700;padding:9px 14px;min-height:38px;display:flex;align-items:center;gap:6px}
.cat-title{padding:12px 14px 6px;font-weight:700;color:var(--muted);font-size:13.5px}

/* ===== polish ===== */
.brand{display:flex;align-items:center;gap:8px}
.brand img{width:30px;height:30px;border-radius:9px;box-shadow:0 2px 6px rgba(47,122,104,.3)}
.top{border-bottom:1px solid transparent}
.seg{background:#e9e6df}
.seg button{font-weight:600}
.seg button.on{box-shadow:0 2px 8px -2px rgba(31,42,39,.18)}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);color:#fff;border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 12px 28px -12px rgba(47,122,104,.55)}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::before{content:"";position:absolute;top:-50px;left:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero-in{position:relative;z-index:1;display:flex;align-items:center;gap:16px}
.ring{flex:0 0 86px;width:86px;height:86px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.22)}
.ring .fg{stroke:#fff;transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.ring .pc{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:20px}
.hero .date{font-size:13px;opacity:.85}
.hero .big{font-size:24px;font-weight:800;margin:2px 0 8px;line-height:1.15}
.hero .big small{font-size:14px;font-weight:500;opacity:.9}
.hero .chips2{display:flex;gap:6px;flex-wrap:wrap}
.hero .chips2 span{background:rgba(255,255,255,.18);border-radius:20px;padding:4px 10px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.hero .chips2 i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tic{flex:0 0 40px;width:40px;height:40px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:20px;transition:filter .2s,opacity .2s}
.row.done .tic{filter:grayscale(1);opacity:.5}
.row{gap:10px}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:800;color:#fff;flex:0 0 22px}
.av.big{width:30px;height:30px;flex-basis:30px;font-size:14px}
.pill.round{padding:0;width:36px;justify-content:center}
.pill.round .av{width:26px;height:26px;flex-basis:26px;font-size:13px}
.ract{align-items:center}
.av.shimon{background:var(--shimon)}.av.aviya{background:var(--aviya)}
.pill{display:inline-flex;align-items:center;gap:6px}
.pill.shimon,.pill.aviya{padding-inline-start:6px}
.pill.me{box-shadow:0 4px 10px -4px rgba(47,122,104,.6)}
.chk{border-color:#d6d1c6}
.cemoji{font-size:19px;width:30px;text-align:center}
.cat-title{display:flex;align-items:center;gap:8px}
.weekstrip{padding:12px 6px}
.weekstrip button.today .c{background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 14px -6px rgba(47,122,104,.7)}
.card,.list,.cat{border:1px solid rgba(31,42,39,.04)}
h3.sec{text-transform:none;font-size:13.5px;color:var(--muted)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti span{position:absolute;top:-30px;font-size:22px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}.row.pop .chk{animation:none}}

/* stats */
.month-nav{display:flex;align-items:center;justify-content:space-between}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.score .card{margin-bottom:14px}
.sc .nm{font-weight:800;font-size:16px}
.sc .big{font-size:38px;font-weight:800;line-height:1.1;margin-top:4px}
.sc.shimon{border-top:4px solid var(--shimon)}.sc.shimon .big{color:var(--shimon)}
.sc.aviya{border-top:4px solid var(--aviya)}.sc.aviya .big{color:var(--aviya)}
.row-sb{display:flex;justify-content:space-between;align-items:center;gap:8px}
.split{display:flex;height:14px;border-radius:8px;overflow:hidden;margin-top:6px;background:var(--soft)}
.split i{display:block;height:100%;transition:width .5s}
.split .shimon{background:var(--shimon)}.split .aviya{background:var(--aviya)}
.srow{padding:12px 14px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.sbars{display:flex;flex-direction:column;gap:3px;margin:7px 0 5px}
.sbar{display:block;height:7px;border-radius:4px}
.sbar.shimon{background:var(--shimon)}.sbar.aviya{background:var(--aviya)}

/* stats v2 */
.mnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
.mbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);font-size:24px;line-height:1;color:var(--ink);display:grid;place-items:center;padding-bottom:3px}
.mbtn:disabled{opacity:.3}
.mlabel{font-size:18px;display:flex;align-items:center;gap:8px}
.mlabel b{font-weight:800;font-size:21px}
.mlabel .now{font-size:11.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:2px 8px}
.st-hero{position:relative;overflow:hidden;background:linear-gradient(140deg,#24564b 0%,var(--accent) 55%,var(--accent-2) 100%);color:#fff;border-radius:26px;padding:18px 16px 16px;margin-bottom:14px;box-shadow:0 14px 30px -14px rgba(36,86,75,.7)}
.st-hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.06);top:-90px;left:-70px}
.st-top{display:flex;justify-content:space-between;font-size:13px;opacity:.9;position:relative}
.vs{display:flex;align-items:center;justify-content:space-around;margin:14px 0 12px;position:relative}
.vsp{text-align:center;flex:1}
.vav{position:relative;width:58px;height:58px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-size:24px;font-weight:800;border:3px solid rgba(255,255,255,.85)}
.vav.shimon{background:var(--shimon)}.vav.aviya{background:var(--aviya)}
.vsp.lead .vav{box-shadow:0 0 0 5px rgba(255,255,255,.18)}
.crown{position:absolute;top:-18px;font-size:20px}
.vname{font-weight:700;font-size:15px}
.vpts{font-size:40px;font-weight:800;line-height:1.05}
.vsub{font-size:12.5px;opacity:.85}
.vsmid{font-weight:800;font-size:13px;opacity:.6;letter-spacing:1px}
.vbar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.2);position:relative}
.vbar i{display:block;height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.vbar .shimon{background:#b9cbf3}.vbar .aviya{background:#f5bfd0}
.vfoot{display:flex;justify-content:space-between;font-size:12.5px;margin-top:7px;opacity:.95;position:relative}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:12px 10px;text-align:center;border:1px solid rgba(31,42,39,.04);min-width:0}
.ti{font-size:20px}
.tv{font-size:24px;font-weight:800;margin-top:2px}
.tv.sm{font-size:13.5px;font-weight:700;line-height:1.25;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tl{font-size:11.5px;color:var(--muted);margin-top:3px}
.ctitle{font-weight:800;font-size:15.5px;margin-bottom:12px}
.dw{margin-bottom:12px}
.dwh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.dwh .who{display:inline-flex;align-items:center;gap:7px;font-weight:700}
.dwbar{display:flex;height:12px;border-radius:7px;overflow:hidden;background:var(--soft)}
.dwbar i{display:block;height:100%}
.dwbar.shimon .d{background:var(--shimon)}.dwbar.shimon .w{background:#9fb4e2}
.dwbar.aviya .d{background:var(--aviya)}.dwbar.aviya .w{background:#eaa6bb}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;background:#7c8a86}
.legend i.w{background:#c3ccc9}
.tk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.ctitle + .tk{border-top:0;padding-top:0}
.tkb{flex:1;min-width:0}
.tkh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tkn{font-weight:600;font-size:15px}
.tkc{font-weight:800;font-size:14px;white-space:nowrap}
.tkc .wk{font-size:10.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:1px 6px;margin-inline-start:4px}
.tkbar{display:flex;height:8px;border-radius:5px;overflow:hidden;margin:7px 0 5px;background:var(--soft)}
.tkbar i{display:block;height:100%}
.tkbar .shimon{background:var(--shimon)}.tkbar .aviya{background:var(--aviya)}
.tkf{display:flex;gap:12px;font-size:12px;font-weight:600}
.wchart{display:flex;align-items:flex-end;gap:10px;height:170px;padding:0 4px 4px;border-bottom:1px solid var(--line);margin-bottom:10px}
.wcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.wbars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.wb{width:min(18px,40%);border-radius:7px 7px 3px 3px;min-height:4px;position:relative;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.wb span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--muted)}
.wb.shimon{background:var(--shimon)}.wb.aviya{background:var(--aviya)}
.wl{font-size:11px;color:var(--muted);margin-top:6px}
.evr{display:flex;justify-content:space-around}
.evr>div{display:flex;align-items:center;gap:8px}
.evr b{font-size:22px;font-weight:800}
.st-empty{text-align:center;padding:30px 20px}
.st-empty .em{font-size:44px;margin-bottom:8px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(30,25,15,.35);z-index:40;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:19px;margin:4px 0 14px}
.sheet label.l{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 8px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;margin-top:10px;background:var(--soft);color:var(--ink)}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:#fbeceb;color:var(--danger)}
.btn:disabled{opacity:.5}
.field{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 13px;font-size:16px;outline:none}
.field:focus{border-color:var(--accent)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:13px;font-weight:700;font-size:15.5px}
.pick button.on.shimon{border-color:var(--shimon);background:var(--shimon-soft);color:var(--shimon)}
.pick button.on.aviya{border-color:var(--aviya);background:var(--aviya-soft);color:var(--aviya)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 0;font-weight:700;font-size:15px;line-height:1.15}
.days button small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.days button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.mrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow .nm{flex:1;font-weight:600;border:0;background:none;text-align:right;padding:6px 0;font-size:15.5px}
.mrow.off .nm{color:var(--faint);text-decoration:line-through}
.switch{position:relative;width:46px;height:28px;flex:0 0 46px;border-radius:14px;background:#d8d2c7;border:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(-18px)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#2a2722;color:#fff;padding:12px 18px;border-radius:14px;font-size:14.5px;z-index:60;opacity:0;transition:all .25s;max-width:calc(100vw - 32px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--danger)}

/* auth */
.auth{max-width:420px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top)) 20px 20px;text-align:center}
.auth .logo{width:84px;height:84px;border-radius:24px;margin:0 auto 14px;display:block;box-shadow:var(--shadow)}
.auth h1{margin:0 0 6px;font-size:26px}
.auth .card{text-align:right;margin-top:22px}
.err-txt{color:var(--danger);font-size:14px;margin-top:10px;min-height:1em}
.who{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.who button{border:0;border-radius:20px;padding:26px 10px;font-size:20px;font-weight:800;box-shadow:var(--shadow)}
.who .shimon{background:var(--shimon-soft);color:var(--shimon)}
.who .aviya{background:var(--aviya-soft);color:var(--aviya)}
.who button:disabled{opacity:.4}
</style>

<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module">
/* =====================================================================
   הגדרות חיבור ל־Firebase. מדביקים כאן את firebaseConfig מהמסוף של Firebase.
   כל עוד זה null, האפליקציה רצה במצב בדיקה מקומי בלבד ומציגה זאת בבירור.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBqSE2h0pQBCVmEpePOY3yleA_YiuUi26s",
  authDomain: "bayit-shelanu-55afe.firebaseapp.com",
  projectId: "bayit-shelanu-55afe",
  storageBucket: "bayit-shelanu-55afe.firebasestorage.app",
  messagingSenderId: "971005983452",
  appId: "1:971005983452:web:357b44270fe013ce72d219",
};
const APP_VERSION = '2.0';
const FB_SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';

/* ---------- אנשים ---------- */
const PEOPLE = { shimon:{name:'שמעון', f:false}, aviya:{name:'אביה', f:true} };
const other = p => p === 'shimon' ? 'aviya' : 'shimon';
const pname = p => PEOPLE[p]?.name || '';
const gv = (p, m, f) => PEOPLE[p]?.f ? f : m;

/* ---------- עזרי תצוגה ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function toast(msg, err=false){ const t=$('#toast'); t.textContent=msg; t.classList.toggle('err',err); t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), err?4200:2400); }
const store = { get(k,d){ try{ const v=localStorage.getItem('bayit-'+k); return v==null?d:JSON.parse(v);}catch{return d} }, set(k,v){ try{localStorage.setItem('bayit-'+k,JSON.stringify(v))}catch{} } };

/* =====================================================================
   זמן: הכול לפי שעון ישראל (Asia/Jerusalem), כולל מעבר שעון קיץ/חורף.
   יום = תאריך ישראלי. שבוע = ממוצאי שבת 21:30 עד מוצאי השבת הבאה 21:29:59.
   כל יום/שבוע נשמר ברשומה נפרדת, ולכן "איפוס" קורה מעצמו בתחילת תקופה חדשה,
   גם אם אף אחד לא פתח את האפליקציה, והתקופות הקודמות נשמרות כהיסטוריה.
   ===================================================================== */
const TZ = 'Asia/Jerusalem';
const ilFmt = new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23',weekday:'short'});
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function il(ms){ const o={}; for(const p of ilFmt.formatToParts(new Date(ms))) o[p.type]=p.value; return {y:+o.year,m:+o.month,d:+o.day,h:+o.hour%24,mi:+o.minute,wd:WD.indexOf(o.weekday)}; }
const pad = n => String(n).padStart(2,'0');
const ymd = (y,m,d) => `${y}-${pad(m)}-${pad(d)}`;
function addDays(id,n){ const [y,m,d]=id.split('-').map(Number); const t=new Date(Date.UTC(y,m-1,d+n)); return ymd(t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate()); }
function dayIdOf(ms){ const p=il(ms); return ymd(p.y,p.m,p.d); }
const WEEK_RESET_MIN = 21*60+30;
function weekIdOf(ms){ const p=il(ms); const today=ymd(p.y,p.m,p.d);
  if(p.wd===6 && p.h*60+p.mi >= WEEK_RESET_MIN) return today;          // מוצאי שבת אחרי 21:30: שבוע חדש
  return addDays(today, -(p.wd===6 ? 7 : p.wd+1)); }                    // אחרת: מוצאי השבת הקודמת
const DAY_NAMES = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const DAY_SHORT = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const dm = id => { const [,m,d]=id.split('-').map(Number); return `${d}.${m}`; };
const weekDate = (wid, dayIdx) => addDays(wid, dayIdx+1);   // ראשון = יום אחרי מוצאי שבת
function hhmm(ms){ const p=il(ms); return `${pad(p.h)}:${pad(p.mi)}`; }

let clockOffset = 0;          // הפרש מול שעון השרת (כדי ששעון שגוי בטלפון לא יבלבל)
let testShift = 0;            // רק במצב בדיקה מקומי
const now = () => Date.now() + clockOffset + testShift;

/* =====================================================================
   שכבת נתונים. אותו ממשק בדיוק ל־Firebase ולמצב בדיקה מקומי.
   ===================================================================== */
const LOCAL_MODE = !FIREBASE_CONFIG;
let B;

class Conflict extends Error { constructor(cur){ super('conflict'); this.code='conflict'; this.cur=cur; } }

async function firebaseBackend(cfg){
  const [appM, authM, fs] = await Promise.all([import(FB_SDK+'firebase-app.js'), import(FB_SDK+'firebase-auth.js'), import(FB_SDK+'firebase-firestore.js')]);
  const app = appM.initializeApp(cfg);
  const auth = authM.getAuth(app);
  let db;
  try { db = fs.initializeFirestore(app, {localCache: fs.persistentLocalCache({tabManager: fs.persistentMultipleTabManager()})}); }
  catch { db = fs.getFirestore(app); }
  const ref = p => fs.doc(db, p), col = p => fs.collection(db, p);
  const snapDocs = s => s.docs.map(d => ({id:d.id, ...d.data(), _pending:d.metadata.hasPendingWrites}));
  return {
    onUser: cb => authM.onAuthStateChanged(auth, u => cb(u ? {uid:u.uid, email:u.email} : null)),
    signIn: (e,p) => authM.signInWithEmailAndPassword(auth, e, p),
    signUp: (e,p) => authM.createUserWithEmailAndPassword(auth, e, p),
    resetPassword: e => authM.sendPasswordResetEmail(auth, e),
    signOut: () => authM.signOut(auth),
    watchCol: (p, cb, err) => fs.onSnapshot(col(p), {includeMetadataChanges:true}, s => cb(snapDocs(s)), err),
    get: async p => { const s = await fs.getDoc(ref(p)); return s.exists() ? s.data() : null; },
    list: async p => (await fs.getDocs(col(p))).docs.map(d => ({id:d.id, ...d.data()})),
    set: (p, d, merge=false) => fs.setDoc(ref(p), d, {merge}),
    del: p => fs.deleteDoc(ref(p)),
    newId: () => fs.doc(col('_')).id,
    batch: async ops => { const b = fs.writeBatch(db); for(const o of ops){ if(o.del) b.delete(ref(o.path)); else b.set(ref(o.path), o.data, {merge:!!o.merge}); } await b.commit(); },
    tx: (p, fn, side) => fs.runTransaction(db, async t => { const s = await t.get(ref(p)); const prev = s.exists() ? s.data() : null; const nd = fn(prev); t.set(ref(p), nd);
      for(const o of (side ? side(prev, nd) : [])){ if(o.del) t.delete(ref(o.path)); else t.set(ref(o.path), o.data); } return nd; }),
    async syncClock(uid){ try{ await fs.setDoc(ref('users/'+uid), {ping: fs.serverTimestamp()}, {merge:true}); const s = await fs.getDocFromServer(ref('users/'+uid)); const t = s.data()?.ping?.toMillis?.(); if(t) clockOffset = t - Date.now(); }catch{} },
  };
}

/* מצב בדיקה מקומי: מסד נתונים בתוך הדפדפן, משותף בין לשוניות (כל לשונית = "מכשיר").
   משמש רק לבדיקות. מתנהג כמו Firebase: עסקאות עם בדיקת גרסה, השהיה, וסימולציית ניתוק. */
function localBackend(){
  const K = 'bayit-localdb';
  const read = () => { try{ return JSON.parse(localStorage.getItem(K)) || {}; }catch{ return {}; } };
  let db = read(); const subs = new Set();
  const notify = () => subs.forEach(f => f());
  const commit = () => { localStorage.setItem(K, JSON.stringify(db)); notify(); };
  addEventListener('storage', e => { if(e.key === K){ db = read(); notify(); } });
  const parent = k => k.slice(0, k.lastIndexOf('/'));
  const wait = () => new Promise(r => setTimeout(r, 150));
  const net = () => { if(window.__offline || !navigator.onLine){ const e = new Error('offline'); e.code = 'unavailable'; throw e; } };
  const sess = () => { try{ return JSON.parse(sessionStorage.getItem('bayit-local-user')); }catch{ return null; } };
  let userCb;
  return {
    onUser: cb => { userCb = cb; cb(sess()); },
    async signIn(person){ const u = {uid:'local-'+person, email:person+'@local.test'}; sessionStorage.setItem('bayit-local-user', JSON.stringify(u)); userCb(u); },
    async signOut(){ sessionStorage.removeItem('bayit-local-user'); userCb(null); },
    watchCol(p, cb){ const f = () => cb(Object.entries(db).filter(([k]) => parent(k) === p).map(([k,v]) => ({id:k.slice(k.lastIndexOf('/')+1), ...v}))); subs.add(f); setTimeout(f); return () => subs.delete(f); },
    async get(p){ await wait(); net(); db = read(); return db[p] ? {...db[p]} : null; },
    async list(p){ db = read(); return Object.entries(db).filter(([k]) => parent(k) === p).map(([k,v]) => ({id:k.slice(k.lastIndexOf('/')+1), ...v})); },
    async set(p, d, merge=false){ await wait(); net(); db = read(); db[p] = merge ? {...db[p], ...d} : {...d}; commit(); },
    async del(p){ await wait(); net(); db = read(); delete db[p]; commit(); },
    newId: () => Math.random().toString(36).slice(2, 12) + Date.now().toString(36),
    async batch(ops){ await wait(); net(); db = read(); for(const o of ops){ if(o.del) delete db[o.path]; else db[o.path] = o.merge ? {...db[o.path], ...o.data} : {...o.data}; } commit(); },
    async tx(p, fn, side){ await wait(); net(); db = read(); const prev = db[p] ? {...db[p]} : null; const nd = fn(prev); db[p] = nd;
      for(const o of (side ? side(prev, nd) : [])){ if(o.del) delete db[o.path]; else db[o.path] = {...o.data}; } commit(); return nd; },
    async syncClock(){},
  };
}

/* ---------- הודעות שגיאה ברורות ---------- */
function errMsg(e){
  if(e?.code === 'conflict') return conflictMsg(e.cur);
  if(!navigator.onLine || e?.code === 'unavailable' || e?.code === 'failed-precondition' && /offline/i.test(e.message)) return 'אין חיבור לאינטרנט. הפעולה לא נשמרה.';
  if(e?.code === 'permission-denied') return 'אין הרשאה לפעולה הזו.';
  return 'השמירה נכשלה. נסו שוב.';
}
function conflictMsg(cur){
  if(cur?.done) return `המשימה כבר סומנה כבוצעה ע״י ${pname(cur.doneBy || cur.updatedBy)}.`;
  if(cur?.assignee && cur.assignee !== S.person && cur.updatedBy === cur.assignee) return `${pname(cur.assignee)} ${gv(cur.assignee,'כבר לקח','כבר לקחה')} את המשימה הזו.`;
  if(cur?.assignee && cur.updatedBy && cur.updatedBy !== S.person) return `${pname(cur.updatedBy)} ${gv(cur.updatedBy,'שינה','שינתה')} את המשימה הזו הרגע. בדקו ונסו שוב.`;
  return 'המשימה עודכנה בינתיים ממכשיר אחר. בדקו ונסו שוב.';
}

/* =====================================================================
   נתוני התחלה (נוצרים פעם אחת, עם מזהים קבועים כדי שלא ייווצרו כפילויות)
   ===================================================================== */
const SEED_DAILY = ['שטיפת כלים','הפעלת מכונת כביסה','תליית כביסה / העברה למייבש','קיפול כביסה והכנסה לארונות','איפוס הבית – סידור הסלון והמרחב המרכזי','זריקת זבל','סידור המטבח בסוף היום','ניקוי השיש ושולחן האוכל','השקיית עציצים'];
const SEED_WEEKLY = ['שטיפת רצפות בכל הבית','סידור וניקיון חדר הילדים','סידור וניקיון חדר העבודה','סידור וניקיון חדר ההורים','ניקיון מקלחת ההורים','ניקיון השירותים','ניקיון המקרר','ניקיון אזור מכונת הכביסה והמייבש','סידור המחסן','ניקיון יסודי של המטבח','סידור וניקיון החצר','ניקיון הרכבים','החלפת מצעים','שאיבת אבק יסודית','ניקוי אבק ממשטחים ורהיטים'];
const SEED_SHOP = [
  ['ירקות ופירות',['עגבניות','מלפפונים','בצל','שום','תפוחי אדמה','בטטות','גזר','פלפלים','חסה','לימונים','בננות','תפוחים','אבוקדו']],
  ['מוצרי חלב ותחליפים',['חלב','חלב סויה','משקה שיבולת שועל','יוגורט','גבינה צהובה','גבינה לבנה','קוטג׳','חמאה','ביצים']],
  ['לחמים ומאפים',['לחם','פיתות','לחמניות','טורטיות','פריכיות']],
  ['מוצרים יבשים ומזווה',['אורז','פסטה','קמח','סוכר','מלח','שמן זית','שמן קנולה','רסק עגבניות','טחינה','קפה','תה','שיבולת שועל','תבלינים']],
  ['קטניות ומוצרי חלבון מהצומח',['עדשים כתומות','עדשים ירוקות','חומוס יבש','שעועית לבנה','טופו','גרגרי סויה']],
  ['מוצרים קפואים',['ירקות קפואים','אפונה קפואה','תירס קפוא','פירות קפואים','בצק עלים']],
  ['חטיפים ומתוקים',['במבה','ביסלי','שוקולד','עוגיות','אגוזים','פירות יבשים']],
  ['שתייה',['מים מינרליים','סודה','מיץ','תרכיז פטל']],
  ['חומרי ניקיון',['נוזל כלים','טבליות למדיח','אבקת כביסה','מרכך כביסה','אקונומיקה','מנקה רצפות','ספוגים','שקיות זבל']],
  ['היגיינה וטיפוח',['נייר טואלט','מגבונים','משחת שיניים','מברשות שיניים','שמפו','סבון גוף','סבון ידיים','דאודורנט']],
  ['מוצרי תינוקות וילדים',['חיתולים','מגבונים לתינוק','קרם החתלה','דייסה']],
  ['מוצרים לבית',['נייר סופג','נייר אפייה','נייר כסף','ניילון נצמד','שקיות אוכל','סוללות','נורות']],
  ['שונות',['נרות','גפרורים']],
];
/* כמה "משימות" שווה כל משימה: יומית = 1, שבועית = לפי ההגדרה (ברירת מחדל לפי הטבלה) */
const DEFAULT_W = {w01:3,w02:2,w03:2,w04:2,w05:2,w06:2,w07:2,w08:1,w09:2,w10:3,w11:3,w12:3,w13:2,w14:3,w15:2};
const ptsOf = d => !d ? 1 : d.kind==='daily' ? 1 : (Number.isFinite(d.points) ? d.points : (DEFAULT_W[d.id] ?? 2));
const TASK_IC = {d01:'🍽️',d02:'🧺',d03:'👕',d04:'🗄️',d05:'🛋️',d06:'🗑️',d07:'🍳',d08:'✨',d09:'🪴',
  w01:'🧽',w02:'🧸',w03:'💻',w04:'🛏️',w05:'🚿',w06:'🚽',w07:'🧊',w08:'🫧',w09:'📦',w10:'🍲',w11:'🌿',w12:'🚗',w13:'🛌',w14:'🌀',w15:'🪶'};

const taskIc = d => TASK_IC[d.id] || (/כביסה/.test(d.name)?'🧺':/מטבח|כלים/.test(d.name)?'🍽️':/עציצ|גינה|חצר/.test(d.name)?'🪴':/רכב/.test(d.name)?'🚗':/רצפ|אבק/.test(d.name)?'🧹':'✔️');
const catIc = c => CAT_IC[c.id] || '🛒';
const av = p => `<span class="av ${p}">${pname(p).charAt(0)}</span>`;
const nkey = s => String(s).trim().replace(/\s+/g,' ').replace(/[״"׳'`]/g,'').toLowerCase();

async function seedIfNeeded(){
  if(await B.get('meta/seed')) return;
  const ops = [], t = now();
  SEED_DAILY.forEach((n,i) => ops.push({path:`taskDefs/d${pad(i+1)}`, data:{name:n, kind:'daily', order:i+1, active:true, createdAt:t}}));
  SEED_WEEKLY.forEach((n,i) => ops.push({path:`taskDefs/w${pad(i+1)}`, data:{name:n, kind:'weekly', order:i+1, active:true, createdAt:t}}));
  SEED_SHOP.forEach(([cat, prods], ci) => {

  });

  await B.batch(ops);   // מזהים קבועים: גם אם שני המכשירים יריצו בו־זמנית, לא ייווצרו כפילויות
}

/* עדכון קטלוג 2: מוצרים חדשים בירקות ופירות, וסידור הקטגוריה: ירקות, אחר כך פירות, אחר כך עשבי תיבול.
   רץ פעם אחת בלבד (meta/catalog2), לא יוצר כפילויות ולא נוגע במוצרים שהועברו לקטגוריה אחרת. */
const CAT2_NEW = ['קישואים','חצילים','פטריות','כרוב','כרובית','ברוקולי','בצל ירוק','פטרוזיליה','כוסברה','שמיר','נענע','סלרי','עגבניות שרי','קלמנטינות','תפוזים','אגסים','ענבים','תותים','אבטיח','מלון'];
const CAT2_ORDER = [
  'עגבניות','עגבניות שרי','מלפפונים','פלפלים','בצל','בצל ירוק','שום','תפוחי אדמה','בטטות','גזר','קישואים','חצילים','פטריות','כרוב','כרובית','ברוקולי','חסה','סלרי',
  'בננות','תפוחים','אגסים','תפוזים','קלמנטינות','לימונים','אבוקדו','ענבים','תותים','אבטיח','מלון',
  'פטרוזיליה','כוסברה','שמיר','נענע'];
async function migrateCatalog2(){
  if(await B.get('meta/catalog2')) return;
  const prods = await B.list('products');
  const byKey = new Map(prods.map(p => [p.key || nkey(p.name), p]));
  const ops = [];
  CAT2_NEW.forEach((n, i) => { if(!byKey.has(nkey(n))){ const id = `c01p${pad(14+i)}`; const p = {id, name:n, key:nkey(n), categoryId:'c01'}; byKey.set(p.key, p); ops.push({path:`products/${id}`, data:{name:n, key:p.key, categoryId:'c01', order:0}}); } });
  CAT2_ORDER.forEach((n, i) => { const p = byKey.get(nkey(n)); if(p && p.categoryId === 'c01'){
    const op = ops.find(o => o.path === `products/${p.id}`);
    if(op) op.data.order = i+1; else ops.push({path:`products/${p.id}`, data:{order:i+1}, merge:true}); } });
  ops.push({path:'meta/catalog2', data:{at:now(), by:S.person}});
  await B.batch(ops);
}

/* עדכון קטלוג 3: טופו עובר למוצרי חלב ותחליפים, העדשים עוברים למוצרים יבשים,
   ושאר הקטגוריה "קטניות ומוצרי חלבון מהצומח" נמחקת יחד עם הקטגוריה עצמה. רץ פעם אחת (meta/catalog3). */
async function migrateCatalog3(){
  if(await B.get('meta/catalog3')) return;
  const cats = await B.list('categories');
  const legumes = cats.find(c => c.id === 'c05') || cats.find(c => nkey(c.name).startsWith('קטניות'));
  const ops = [];
  if(legumes){
    const prods = await B.list('products');
    const nextOrder = cid => { const o = Math.max(0, ...prods.filter(p => p.categoryId === cid).map(p => p.order || 0)) + 1; prods.push({categoryId:cid, order:o}); return o; };
    const dairy = cats.find(c => c.id === 'c02') || cats.find(c => nkey(c.name).startsWith('מוצרי חלב'));
    const dry = cats.find(c => c.id === 'c04') || cats.find(c => nkey(c.name).startsWith('מוצרים יבשים'));
    for(const p of prods.filter(x => x.id && x.categoryId === legumes.id)){
      const k = p.key || nkey(p.name);
      if(k === nkey('טופו') && dairy) ops.push({path:`products/${p.id}`, data:{categoryId:dairy.id, order:nextOrder(dairy.id)}, merge:true});
      else if(k.startsWith('עדשים') && dry) ops.push({path:`products/${p.id}`, data:{categoryId:dry.id, order:nextOrder(dry.id)}, merge:true});
      else ops.push({path:`products/${p.id}`, del:true}, {path:`missing/${p.id}`, del:true});
    }
    ops.push({path:`categories/${legumes.id}`, del:true});
  }
  ops.push({path:'meta/catalog3', data:{at:now(), by:S.person}});
  await B.batch(ops);
}

/* עדכון קטלוג 4: קטגוריה חדשה "יבשים נוספים" מיד אחרי "מוצרים יבשים ומזווה". רץ פעם אחת (meta/catalog4). */
async function migrateCatalog4(){
  if(await B.get('meta/catalog4')) return;
  const cats = (await B.list('categories')).sort((a,b) => (a.order||0)-(b.order||0));
  const ops = [];
  if(!cats.some(c => nkey(c.name) === nkey('יבשים נוספים'))){
    const i = cats.findIndex(c => c.id === 'c04' || nkey(c.name).startsWith('מוצרים יבשים'));
    const list = cats.slice(); list.splice(i >= 0 ? i+1 : list.length, 0, {id:'c14', name:'יבשים נוספים', isNew:true});
    list.forEach((c,k) => ops.push(c.isNew ? {path:'categories/c14', data:{name:'יבשים נוספים', order:k+1}} : {path:`categories/${c.id}`, data:{order:k+1}, merge:true}));
  }
  ops.push({path:'meta/catalog4', data:{at:now(), by:S.person}});
  await B.batch(ops);
}

  filter:'all', selDay:null, search:'', editCat:null, openCat: store.get('openCat', null),

const busy = new Set(); const justDone = new Set(); const leaving = new Set();
let unsubs = [], periodUnsubs = [], loaded = {};

const activeDefs = kind => S.defs.filter(d => d.kind===kind && d.active && !d.deleted).sort((a,b) => a.order-b.order);
const slotOf = (map, id) => map[id] || {v:0, assignee:null, done:false};
const weeklyToday = () => activeDefs('weekly').map(d => [d, slotOf(S.weekly, d.id)])
  .filter(([,s]) => s.assignee && s.day!=null && weekDate(S.weekId, s.day) === S.dayId);
const catsSorted = () => S.cats.slice().sort((a,b) => a.order-b.order);

/* ---------- מנויים בזמן אמת ---------- */
function onErr(e){ console.warn(e); if(e?.code==='permission-denied') showUnauthorized(); }
function subscribe(){
  unsubs.forEach(f=>f()); unsubs = [];
  const mark = k => { if(!loaded[k]){ loaded[k]=true; if(['defs','cats','prods','missing'].every(x=>loaded[x])){ S.ready=true; } } };
  unsubs.push(B.watchCol('taskDefs', d => { S.defs=d; mark('defs'); paint(); }, onErr));
  unsubs.push(B.watchCol('categories', d => { S.cats=d; mark('cats'); paint(); }, onErr));
  unsubs.push(B.watchCol('products', d => { S.prods=d; mark('prods'); paint(); }, onErr));
  unsubs.push(B.watchCol('completions', d => { S.comps=d; S.compsLoaded=true; S.compsDenied=false; if(S.main==='stats') paint(); },
    e => { console.warn(e); S.compsDenied = e?.code==='permission-denied'; S.compsLoaded = true; if(S.main==='stats') paint(); }));
  unsubs.push(B.watchCol('missing', d => { S.missing=Object.fromEntries(d.map(x=>[x.id,x])); mark('missing'); paint(); }, onErr));
  checkPeriod(true);
}
function checkPeriod(force=false){
  const d = dayIdOf(now()), w = weekIdOf(now());
  if(!force && d===S.dayId && w===S.weekId) return;
  const changed = S.dayId && (d!==S.dayId || w!==S.weekId);
  if(changed) S.selDay = null;
  S.dayId = d; S.weekId = w;
  periodUnsubs.forEach(f=>f()); periodUnsubs = [];
  S.daily = {}; S.weekly = {};
  periodUnsubs.push(B.watchCol(`daily/${d}/slots`, docs => { S.daily = Object.fromEntries(docs.map(x=>[x.id,x])); paint(); }, onErr));
  periodUnsubs.push(B.watchCol(`weekly/${w}/slots`, docs => { S.weekly = Object.fromEntries(docs.map(x=>[x.id,x])); paint(); }, onErr));
  if(changed) toast('התחילה תקופה חדשה, הרשימה התאפסה');
  paint();
}

/* =====================================================================
   פעולות משימות: כל שינוי הוא עסקה שבודקת שהמשימה לא השתנתה מאז שראיתם אותה
   (מספר גרסה v). כך שני אנשים לא יכולים לתפוס את אותה משימה בו־זמנית.
   ===================================================================== */
async function slotOp(kind, taskId, expectedV, change, okMsg){
  const key = kind+':'+taskId;
  if(busy.has(key)) return false;
  const period = kind==='d' ? S.dayId : S.weekId;
  const path = (kind==='d' ? `daily/${period}` : `weekly/${period}`) + '/slots/' + taskId;
  const def = S.defs.find(x => x.id === taskId);
  busy.add(key); paint();
  try{
    let prevSeen = null, lastSlot = null;
    await B.tx(path, cur => {
      prevSeen = cur;
      cur = cur || {v:0, assignee:null, done:false};
      if((cur.v||0) !== expectedV) throw new Conflict(cur);
      return {...cur, ...change(cur), v:(cur.v||0)+1, updatedBy:S.person, updatedAt:now()};
    }).then(nd => { lastSlot = nd; });
    // יומן לסטטיסטיקה: נכתב אחרי שהשינוי נשמר. אם נכשל, ההשלמה האוטומטית במסך הסטטיסטיקה תשלים אותו.
    for(const o of completionOps(kind, period, taskId, def, prevSeen, lastSlot))
      (o.del ? B.del(o.path) : B.set(o.path, o.data)).catch(e => console.warn('completion log', e));
    if(okMsg) toast(okMsg);
    return true;
  }catch(e){ console.warn(e); toast(errMsg(e), true); return false; }
  finally{ busy.delete(key); paint(); }
}
/* יומן ביצועים לסטטיסטיקה: כל משימה שבוצעה נרשמת עם הניקוד שלה, ונמחקת אם מבטלים את הסימון */
const compId = (kind, period, taskId) => `${kind}_${period}_${taskId}`;
function compData(kind, period, taskId, def, slot){
  const p = il(slot.doneAt || now());
  return {by:slot.doneBy, points: kind==='d' ? 1 : ptsOf(def), at:slot.doneAt || now(), taskId, kind, name:def?.name || '', period, month:`${p.y}-${pad(p.m)}`};
}
function completionOps(kind, period, taskId, def, prev, nd){
  const path = 'completions/' + compId(kind, period, taskId);
  if(nd.done && (!prev?.done || prev.doneBy !== nd.doneBy)) return [{path, data:compData(kind, period, taskId, def, nd)}];
  if(prev?.done && !nd.done) return [{path, del:true}];
  return [];
}
const assignDaily = (id, v, who) => slotOp('d', id, v, () => ({assignee:who}));
async function toggleDaily(id){
  const s = slotOf(S.daily, id);
  const done = !s.done;
  const ok = await slotOp('d', id, s.v||0, cur => done
      ? {done:true, doneBy:S.person, doneAt:now(), assignee: cur.assignee || S.person}
      : {done:false, doneBy:null, doneAt:null});
  if(ok && done){ justDone.add('d:'+id); setTimeout(()=>justDone.delete('d:'+id), 700); paint(); }
}
async function toggleWeekly(id){
  const s = slotOf(S.weekly, id);
  const done = !s.done;
  const ok = await slotOp('w', id, s.v||0, () => done ? {done:true, doneBy:S.person, doneAt:now()} : {done:false, doneBy:null, doneAt:null});
  if(ok && done){ justDone.add('w:'+id); setTimeout(()=>justDone.delete('w:'+id), 700); paint(); }
}

function confetti(){

  const box = document.createElement('div'); box.className = 'confetti';
  const em = ['🎉','✨','💚','⭐','🎊'];
  for(let i=0;i<28;i++){ const sp = document.createElement('span'); sp.textContent = em[i%em.length];

/* ---------- סיכום יומי ---------- */
function paintSummary(){
  const wt = weeklyToday();
  const defs = activeDefs('daily');
  const sl = defs.map(d => slotOf(S.daily, d.id)).concat(wt.map(([,s]) => s));
  const total = sl.length;
  const done = sl.filter(s=>s.done).length;
  const c = p => sl.filter(s=>s.assignee===p).length;
  const free = sl.filter(s=>!s.assignee && !s.done).length;
  const p = il(now());
  const pct = total ? Math.round(done/total*100) : 0;
  const C = 2*Math.PI*38;
  const msg = total && done===total ? 'הכול בוצע היום! 🎉' : `${done} <small>מתוך ${total} בוצעו</small>`;
  $('#summary').innerHTML = `<div class="hero-in">
    <div class="ring"><svg viewBox="0 0 86 86"><circle class="bg" cx="43" cy="43" r="38"/><circle class="fg" cx="43" cy="43" r="38" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/></svg><div class="pc">${pct}%</div></div>
    <div style="flex:1;min-width:0"><div class="date">יום ${DAY_NAMES[p.wd]}, ${p.d} ב${MONTHS[p.m-1]}</div>
      <div class="big">${msg}</div>
      <div class="chips2"><span><i style="background:#c9d7f5"></i>שמעון ${c('shimon')}</span><span><i style="background:#f6c9d6"></i>אביה ${c('aviya')}</span><span>פנויות ${free}</span></div></div></div>`;
  if(total && done===total && S._allDone===false) confetti();
  S._allDone = total ? done===total : null;
}

function paintDaily(){
  const me = S.person, partner = other(me);
  if(S.selDay != null && S.selDay !== todayIdx()) return paintOtherDay(S.selDay);
  $('#filters').classList.remove('hidden');
  const F = [['all','הכול'],['mine','שלי']];
  $('#filters').innerHTML = F.map(([k,l]) => `<button class="chip ${S.filter===k?'on':''}" data-act="filter" data-v="${k}">${l}</button>`).join('');
  const pass = s => S.filter==='all' || (S.filter==='mine' && s.assignee===me) || (S.filter==='partner' && s.assignee===partner) || (S.filter==='free' && !s.assignee && !s.done);
  const defs = activeDefs('daily').filter(d => pass(slotOf(S.daily, d.id)));
  const wt = weeklyToday().filter(([,s]) => pass(s));
  let html = defs.length ? `<div class="list">${defs.map(d => taskRow('d', d, slotOf(S.daily, d.id))).join('')}</div>`
    : `<div class="list"><div class="empty">${S.filter==='free'?'כל המשימות שובצו 👏':'אין משימות להצגה'}</div></div>`;
  if(wt.length) html += `<h3 class="sec">📅 משימות שבועיות שתוכננו להיום</h3><div class="list">${wt.map(([d,s]) => taskRow('w', d, s)).join('')}</div>`;
  $('#body').innerHTML = html;
}

function taskRow(kind, d, s){
  const me = S.person, partner = other(me), k = kind+':'+d.id;
  const isBusy = busy.has(k);
  let meta = '', act = '';
  if(s.done){
    meta = `✓ ${pname(s.doneBy)}${s.doneAt ? ' · '+hhmm(s.doneAt) : ''}`;
    act = s.assignee ? av(s.assignee).replace('class="av','class="av big') : '';
  } else if(s.assignee){
    if(s.updatedBy && s.updatedBy !== s.assignee) meta = `שובץ ע״י ${pname(s.updatedBy)}`;
    act = kind==='d'
      ? `<button class="pill ${s.assignee}" data-act="d-unassign" data-id="${d.id}" aria-label="ביטול השיבוץ">${av(s.assignee)}${s.assignee===me?'אני':pname(s.assignee)} <span style="opacity:.55">✕</span></button>`
      : `<button class="pill ${s.assignee}" data-act="${kind}-sheet" data-id="${d.id}">${av(s.assignee)}${s.assignee===me?'אני':pname(s.assignee)} ▾</button>`;
  } else if(kind==='d'){
    act = `<button class="pill me" data-act="d-assign" data-id="${d.id}" data-p="${me}">אני</button><button class="pill ghost round" data-act="d-assign" data-id="${d.id}" data-p="${partner}" aria-label="שיבוץ ל${pname(partner)}">${av(partner)}</button>`;
  }
  if(isBusy) act = `<div class="spin"></div>`;
  if(kind==='w' && s.done) act = `<button class="pill ${s.assignee}" data-act="w-sheet" data-id="${d.id}">${av(s.assignee)}${s.assignee===me?'אני':pname(s.assignee)} ▾</button>`;
  return `<div class="row ${s.done?'done':''} ${isBusy?'busy':''} ${justDone.has(k)?'pop':''}">
    <button class="chk" data-act="${kind}-done" data-id="${d.id}" aria-label="${s.done?'ביטול סימון ביצוע':'סימון כבוצע'}">${CHECK}</button>
    <div class="tic" aria-hidden="true">${taskIc(d)}</div>
    <div class="rbody"><div class="rname">${esc(d.name)}</div>${kind==='w' ? `<div class="rmeta">⭐ ${ptsOf(d)}${meta?' · '+meta:''}</div>` : meta?`<div class="rmeta">${meta}</div>`:''}</div>
    <div class="ract">${act}</div></div>`;
}

function paintOtherDay(day){
  $('#filters').classList.add('hidden');
  const items = activeDefs('weekly').map(d => [d, slotOf(S.weekly, d.id)]).filter(([,s]) => s.assignee && s.day === day);
  let html = `<h3 class="sec" style="margin-top:0">יום ${DAY_NAMES[day]} · ${dm(weekDate(S.weekId, day))}</h3>`;
  html += items.length ? `<div class="list">${items.map(([d,s]) => taskRow('w', d, s)).join('')}</div>`
    : `<div class="list"><div class="empty">עוד לא שובצו משימות שבועיות ליום הזה</div></div>`;
  html += `<button class="btn" data-act="pickWeekly" data-v="${day}">＋ שיבוץ משימה שבועית ליום ${DAY_NAMES[day]}</button>
    <p class="small muted" style="text-align:center;margin-top:10px">המשימות היומיות מופיעות בכל יום מחדש, ביום עצמו.</p>`;
  $('#body').innerHTML = html;
}
function pickWeeklySheet(day){
  const free = activeDefs('weekly').filter(d => { const s = slotOf(S.weekly, d.id); return !(s.assignee && s.day != null); });
  if(!free.length) return toast('כל המשימות השבועיות כבר שובצו');
  sheet(`<h2>איזו משימה ליום ${DAY_NAMES[day]}?</h2><div class="list" style="box-shadow:none;border:1px solid var(--line)">${free.map(d => `<button class="prod" data-id="${d.id}"><span class="pname">${esc(d.name)}</span><span class="muted">‹</span></button>`).join('')}</div><button class="btn" id="cn">ביטול</button>`, sh => {
    $('#cn',sh).onclick = () => closeSheet();
    sh.querySelectorAll('[data-id]').forEach(b => b.onclick = () => weeklySheet(b.dataset.id, day));
  });
}

/* ---------- משימות שבועיות ---------- */
function paintWeekly(){
  const defs = activeDefs('weekly');
  const sched = [], free = [];
  for(const d of defs){ const s = slotOf(S.weekly, d.id); (s.assignee && s.day!=null ? sched : free).push([d,s]); }
  const doneN = sched.filter(([,s])=>s.done).length;
  let html = `<div class="card week-head"><div><div style="font-weight:800">השבוע: ${dm(weekDate(S.weekId,0))}–${dm(weekDate(S.weekId,6))}</div>
    <div class="small muted">מתאפס במוצאי שבת ב־21:30</div></div>
    <div class="ptag free">${doneN} מתוך ${sched.length} ששובצו בוצעו</div></div>`;
  if(sched.length){
    for(let day=0; day<7; day++){
      const items = sched.filter(([,s]) => s.day===day).sort((a,b)=>a[0].order-b[0].order);
      if(!items.length) continue;
      html += `<h3 class="sec">יום ${DAY_NAMES[day]} · ${dm(weekDate(S.weekId,day))}</h3><div class="list">${items.map(([d,s]) => taskRow('w', d, s)).join('')}</div>`;
    }
  }
  html += `<h3 class="sec">${sched.length ? 'עוד לא שובצו' : 'בחרו משימות לשבוע'}</h3>`;
  html += free.length ? `<div class="list">${free.map(([d]) => `<div class="row ${busy.has('w:'+d.id)?'busy':''}"><div class="tic" aria-hidden="true">${taskIc(d)}</div><div class="rbody"><div class="rname">${esc(d.name)}</div><div class="rmeta">⭐ ${ptsOf(d)}</div></div>
      <div class="ract">${busy.has('w:'+d.id)?'<div class="spin"></div>':`<button class="pill me" data-act="w-sheet" data-id="${d.id}">שיבוץ</button>`}</div></div>`).join('')}</div>`
    : `<div class="list"><div class="empty">כל המשימות השבועיות שובצו 👏</div></div>`;
  $('#body').innerHTML = html;
}

/* ---------- סטטיסטיקה ---------- */
let backfilled = false;
async function backfillCompletions(){
  // משלים ליומן כל משימה שבוצעה ועוד לא נרשמה, מתוך הימים והשבועות השמורים (פעם אחת בכל פתיחה)
  if(backfilled || !S.compsLoaded || S.compsDenied) return; backfilled = true;
  try{
    const seed = await B.get('meta/seed');
    let start = dayIdOf(seed?.at || now()); const end = S.dayId;
    if(start < addDays(end, -180)) start = addDays(end, -180);
    const periods = [];
    for(let d = start; d <= end; d = addDays(d, 1)) periods.push(['d', d]);
    for(let w = weekIdOf(new Date(start+'T12:00:00Z').getTime()); w <= S.weekId; w = addDays(w, 7)) periods.push(['w', w]);
    const have = new Set(S.comps.map(c => c.id)), ops = [];
    const lists = await Promise.all(periods.map(([k, per]) => B.list(`${k==='d'?'daily':'weekly'}/${per}/slots`).catch(() => [])));
    lists.forEach((slots, i) => { const [kind, period] = periods[i];
      for(const slot of slots){ if(!slot.done || !slot.doneBy) continue;
        const id = compId(kind, period, slot.id);
        if(!have.has(id)) ops.push({path:'completions/'+id, data:compData(kind, period, slot.id, S.defs.find(x=>x.id===slot.id), slot)}); } });
    for(let i=0; i<ops.length; i+=400) await B.batch(ops.slice(i, i+400));
  }catch(e){ console.warn('backfill', e); backfilled = false; }
}
function paintStats(){
  const body = $('#body');
  if(!S.compsLoaded){ body.innerHTML = `<div class="card"><div class="spin" style="margin:20px auto"></div></div>`; return; }
  if(S.compsDenied){ body.innerHTML = `<div class="card"><div class="empty"><div class="big">🔒</div><b>הסטטיסטיקה תיפתח בקרוב</b><div class="small" style="margin-top:6px">צריך לעדכן הרשאה אחת בשרת. כל המשימות שתבצעו בינתיים נשמרות וייספרו.</div></div></div>`; return; }
  backfillCompletions();
  const p = il(now());
  if(!S.statMonth) S.statMonth = `${p.y}-${pad(p.m)}`;
  const [yy, mm] = S.statMonth.split('-').map(Number);
  const isCurrent = yy===p.y && mm===p.m;
  const ppl = ['shimon','aviya'];
  const pts = c => c.points || 1;
  const sum = (arr, f) => arr.reduce((a,c) => a + f(c), 0);
  const list = S.comps.filter(c => c.month === S.statMonth && PEOPLE[c.by]);
  const tot = Object.fromEntries(ppl.map(q => { const mine = list.filter(c => c.by===q);
    return [q, {pts:sum(mine, pts), n:mine.length, d:sum(mine.filter(c=>c.kind==='d'), pts), w:sum(mine.filter(c=>c.kind==='w'), pts)}]; }));
  const all = tot.shimon.pts + tot.aviya.pts;
  const lead = tot.shimon.pts===tot.aviya.pts ? null : tot.shimon.pts > tot.aviya.pts ? 'shimon' : 'aviya';
  const share = all ? Math.round(tot.shimon.pts/all*100) : 50;

  // המשימות
  const byTask = {};
  for(const c of list){ const def = S.defs.find(x=>x.id===c.taskId);
    const t = byTask[c.taskId] = byTask[c.taskId] || {id:c.taskId, name:def?.name || c.name, kind:c.kind, shimon:0, aviya:0, pts:0};
    t[c.by]++; t.pts += pts(c); }
  const tasks = Object.values(byTask).sort((a,b) => (b.shimon+b.aviya)-(a.shimon+a.aviya) || b.pts-a.pts);
  const maxT = Math.max(1, ...tasks.map(t => t.shimon+t.aviya));

  // הימים והשבועות
  const byDay = {};
  for(const c of list){ const d = dayIdOf(c.at); byDay[d] = (byDay[d]||0) + pts(c); }
  const bestDay = Object.entries(byDay).sort((a,b) => b[1]-a[1])[0];
  const byWeek = {};
  for(const c of list){ const w = weekIdOf(c.at); byWeek[w] = byWeek[w] || {shimon:0, aviya:0}; byWeek[w][c.by] += pts(c); }
  const weeks = Object.keys(byWeek).sort();
  const maxW = Math.max(1, ...weeks.flatMap(w => [byWeek[w].shimon, byWeek[w].aviya]));
  const ever = Object.fromEntries(ppl.map(q => [q, sum(S.comps.filter(c=>c.by===q), pts)]));
  const dayLabel = id => { const x = il(new Date(id+'T12:00:00Z').getTime()); return `${DAY_NAMES[x.wd]} ${dm(id)}`; };

  const nav = `<div class="mnav">
    <button class="mbtn" data-act="month" data-v="-1" aria-label="חודש קודם">›</button>
    <div class="mlabel"><b>${MONTHS[mm-1]}</b> ${yy}${isCurrent?'<span class="now">החודש</span>':''}</div>
    <button class="mbtn" data-act="month" data-v="1" ${isCurrent?'disabled':''} aria-label="חודש הבא">‹</button></div>`;

  if(!all){
    body.innerHTML = nav + `<div class="card st-empty"><div class="em">📊</div><b>עוד אין משימות שבוצעו ב${MONTHS[mm-1]}</b>
      <div class="small muted">כל משימה שמסמנים כבוצעה נספרת כאן. משימה יומית שווה נקודה, ושבועית לפי ה־⭐ שלה.</div></div>`;
    return;
  }

  const hero = `<div class="st-hero">
    <div class="st-top"><span>סיכום ${MONTHS[mm-1]}</span><span>${all} נקודות · ${list.length} משימות</span></div>
    <div class="vs">${ppl.map((q,i) => `${i===1?'<div class="vsmid">VS</div>':''}<div class="vsp ${lead===q?'lead':''}">
      <div class="vav ${q}">${pname(q).charAt(0)}${lead===q?'<span class="crown">👑</span>':''}</div>
      <div class="vname">${pname(q)}</div><div class="vpts">${tot[q].pts}</div><div class="vsub">${tot[q].n} משימות</div></div>`).join('')}</div>
    <div class="vbar"><i class="shimon" style="width:${share}%"></i><i class="aviya" style="width:${100-share}%"></i></div>
    <div class="vfoot"><span>${share}%</span><span>${lead ? `${pname(lead)} ${gv(lead,'מוביל','מובילה')} ב־${Math.abs(tot.shimon.pts-tot.aviya.pts)}` : 'תיקו 🤝'}</span><span>${100-share}%</span></div></div>`;

  const top = tasks[0];
  const tiles = `<div class="tiles">
    <div class="tile"><div class="ti">✅</div><div class="tv">${list.length}</div><div class="tl">משימות בוצעו</div></div>
    <div class="tile"><div class="ti">🔥</div><div class="tv">${bestDay ? bestDay[1] : 0}</div><div class="tl">${bestDay ? 'שיא: '+dayLabel(bestDay[0]) : 'יום שיא'}</div></div>
    <div class="tile"><div class="ti">${top ? taskIc(top) : '⭐'}</div><div class="tv sm">${top ? esc(top.name) : '-'}</div><div class="tl">הכי הרבה פעמים</div></div></div>`;

  const split = `<div class="card"><div class="ctitle">יומיות מול שבועיות</div>${ppl.map(q => {
    const t = tot[q], mx = Math.max(1, t.d + t.w);
    return `<div class="dw"><div class="dwh"><span class="who">${av(q)}${pname(q)}</span><span class="muted small">יומיות ${t.d} · שבועיות ${t.w}</span></div>
      <div class="dwbar ${q}"><i class="d" style="width:${t.d/mx*100}%"></i><i class="w" style="width:${t.w/mx*100}%"></i></div></div>`; }).join('')}
    <div class="legend"><span><i class="d"></i>יומיות</span><span><i class="w"></i>שבועיות</span></div></div>`;

  const taskList = `<div class="card"><div class="ctitle">לפי משימה</div>${tasks.map(t => { const n = t.shimon+t.aviya;
    return `<div class="tk"><div class="tic">${taskIc(t)}</div><div class="tkb">
      <div class="tkh"><span class="tkn">${esc(t.name)}</span><span class="tkc">${t.kind==='w'?'<span class="wk">שבועית</span> ':''}${n} <span style="font-weight:500;font-size:12px;color:var(--muted)">פעמים</span></span></div>
      <div class="tkbar" style="width:${Math.max(12, n/maxT*100)}%"><i class="shimon" style="flex:${t.shimon}"></i><i class="aviya" style="flex:${t.aviya}"></i></div>
      <div class="tkf"><span style="color:var(--shimon)">${pname('shimon')} ${t.shimon}</span><span style="color:var(--aviya)">${pname('aviya')} ${t.aviya}</span></div></div></div>`; }).join('')}</div>`;

  const chart = weeks.length ? `<div class="card"><div class="ctitle">נקודות לפי שבוע</div><div class="wchart">${weeks.map(w => `<div class="wcol">
      <div class="wbars"><div class="wb shimon" style="height:${byWeek[w].shimon/maxW*100}%"><span>${byWeek[w].shimon||''}</span></div><div class="wb aviya" style="height:${byWeek[w].aviya/maxW*100}%"><span>${byWeek[w].aviya||''}</span></div></div>
      <div class="wl">${dm(addDays(w,1))}</div></div>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--shimon)"></i>${pname('shimon')}</span><span><i style="background:var(--aviya)"></i>${pname('aviya')}</span></div></div>` : '';

  const everCard = `<div class="card ever"><div class="ctitle">מאז שהתחלנו</div><div class="evr">${ppl.map(q => `<div>${av(q)}<b>${ever[q]}</b><span class="muted small">נקודות</span></div>`).join('')}</div></div>`;

  body.innerHTML = nav + hero + tiles + split + taskList + chart + everCard +
    `<p class="small muted" style="text-align:center;margin:4px 0 20px">משימה יומית = נקודה. משימה שבועית = לפי ה־⭐ שלה.</p>`;
}

/* ---------- קניות: קטלוג ---------- */
function missingProducts(){ return S.prods.filter(p => S.missing[p.id] && S.cats.some(c=>c.id===p.categoryId)); }
function paintCatalog(){
  const q = nkey(S.search);
  const cats = catsSorted();
  const missN = missingProducts().length;
  $('#catInfo').textContent = missN ? `${missN} מוצרים חסרים` : `${S.prods.length} מוצרים בקטלוג`;
  let html = '';
  if(q){
    const exact = S.prods.some(p => p.key === q);
    if(!exact) html += `<div class="list"><button class="prod" data-act="addFromSearch"><span class="box" style="border-style:dashed">+</span><span class="pname">הוספת "<b>${esc(S.search.trim())}</b>" כמוצר חדש</span></button></div>`;
  }
  for(const [ci, c] of cats.entries()){
    let prods = S.prods.filter(p => p.categoryId===c.id).sort((a,b)=>a.order-b.order || a.name.localeCompare(b.name,'he'));
    if(q) prods = prods.filter(p => p.key.includes(q));
    if(q && !prods.length) continue;
    const closed = !q && S.openCat !== c.id;   // רק קטגוריה אחת פתוחה בכל פעם (בחיפוש: הכול פתוח)
    const nm = prods.filter(p=>S.missing[p.id]).length;
    const ed = !closed && !q && S.editCat === c.id;   // עריכה של הקטגוריה הפתוחה בלבד
    html += `<div class="cat ${closed?'closed':''} ${ed?'editing':''}">
      <div style="display:flex;align-items:center"><button class="cat-h" data-act="toggleCat" data-id="${c.id}"><span class="cemoji" aria-hidden="true">${catIc(c)}</span><span class="name">${esc(c.name)}</span><span class="arrow">▼</span>${nm?`<span class="cnt">${nm} חסרים</span>`:''}</button>
      ${!closed && !q ? `<button class="edit-ic cat-pen ${ed?'on':''}" data-act="editCat" data-id="${c.id}" aria-label="${ed?'סיום עריכה':'עריכת הקטגוריה'}">${ed?'✓':'✎'}</button>` : ''}</div>
      <div class="prods">
      ${ed ? `<div class="cat-bar">
        <button class="chip" data-act="catEdit" data-id="${c.id}">✎ שם / מחיקה</button>
        <button class="chip" data-act="catUp" data-id="${c.id}" ${ci===0?'disabled':''}>↑ למעלה</button>
        <button class="chip" data-act="catDown" data-id="${c.id}" ${ci===cats.length-1?'disabled':''}>↓ למטה</button></div>` : ''}
      ${prods.map(p => {
        const m = S.missing[p.id];
        return `<div style="display:flex;align-items:center"><button class="prod ${m?'miss':''}" data-act="toggleMiss" data-id="${p.id}"><span class="box">${CHECK}</span><span class="pname">${esc(p.name)}</span>
          ${m?(m._pending?'<span class="pend">ממתין לסנכרון…</span>':(isProduce(p)?'<span class="tag">חסר</span>':'')):''}</button>
          ${m && !isProduce(p) ? `<div class="qty"><button data-act="qty" data-id="${p.id}" data-v="1" aria-label="עוד אחד">+</button><b>${qtyOf(m)}</b><button data-act="qty" data-id="${p.id}" data-v="-1" ${qtyOf(m)<=1?'disabled':''} aria-label="אחד פחות">−</button></div>` : ''}
          ${ed?`<button class="edit-ic" style="margin-left:10px" data-act="prodEdit" data-id="${p.id}" aria-label="עריכת מוצר">✎</button>`:''}</div>`;
      }).join('')}
      ${ed ? `<button class="prod add-row" data-act="prodAdd" data-id="${c.id}" style="color:var(--accent);font-weight:600">＋ הוספת מוצר ל${esc(c.name)}</button>` : ''}</div></div>`;
  }
  if(!q) html += `<button class="link-btn" style="width:100%" data-act="catAdd">＋ קטגוריה חדשה</button>`;
  if(!html) html = `<div class="list"><div class="empty">לא נמצאו מוצרים</div></div>`;
  $('#body').innerHTML = html;
}

/* ---------- קניות: רשימה ---------- */
function paintList(){
  const miss = missingProducts();
  if(!miss.length){
    $('#body').innerHTML = `<div class="card"><div class="empty"><div class="big">🧺</div><b>הכול מסודר, אין כרגע מוצרים לקנייה</b><div class="small" style="margin-top:6px">מסמנים מוצר כ"חסר" בלשונית "כל המוצרים" והוא יופיע כאן.</div></div></div>`;
    return;
  }
  let html = `<div class="card list-head"><div><div class="small muted">חסרים כרגע</div><div class="num">${miss.length} <span style="font-size:16px;font-weight:600">מוצרים</span></div></div><div style="font-size:34px">🛒</div></div>`;
  for(const c of catsSorted()){
    const ps = miss.filter(p=>p.categoryId===c.id).sort((a,b)=>a.order-b.order);
    if(!ps.length) continue;
    html += `<div class="list"><div class="cat-title"><span aria-hidden="true">${catIc(c)}</span>${esc(c.name)}</div>${ps.map(p => {
      const m = S.missing[p.id];
      return `<div class="buy-row ${leaving.has(p.id)?'gone':''}">${isProduce(p) ? '' : `<span class="qbadge">${qtyOf(m)}</span>`}<div style="flex:1"><div class="pname">${esc(p.name)}</div>
        <div class="rmeta">${m._pending?'ממתין לסנכרון…':`נוסף ע״י ${pname(m.by)}`}</div></div>
        <button class="buy-btn" data-act="bought" data-id="${p.id}">${!isProduce(p) && qtyOf(m) > 1 ? '✓ נקנה 1' : '✓ נקנה'}</button></div>`;
    }).join('')}</div>`;
  }
  $('#body').innerHTML = html;
}

/* =====================================================================
   גיליון תחתון (Bottom sheet)
   ===================================================================== */
function sheet(html, mount){
  closeSheet(true);
  const scrim = document.createElement('div'); scrim.className='scrim';
  const sh = document.createElement('div'); sh.className='sheet'; sh.setAttribute('role','dialog');
  sh.innerHTML = `<div class="grab"></div>${html}`;
  document.body.append(scrim, sh);
  requestAnimationFrame(() => { scrim.classList.add('show'); sh.classList.add('show'); });
  scrim.onclick = () => closeSheet();
  mount && mount(sh);
  return sh;
}
function closeSheet(instant){
  document.querySelectorAll('.sheet,.scrim').forEach(el => { if(instant) el.remove(); else { el.classList.remove('show'); setTimeout(()=>el.remove(), 260); } });
}
function askText(title, value='', btn='שמירה'){
  return new Promise(res => sheet(`<h2>${esc(title)}</h2><input class="field" id="tx" value="${esc(value)}" autocomplete="off"><button class="btn primary" id="ok">${btn}</button><button class="btn" id="cn">ביטול</button>`, sh => {
    const i = $('#tx',sh); setTimeout(()=>i.focus(), 280);
    const done = v => { closeSheet(); res(v); };
    $('#ok',sh).onclick = () => done(i.value.trim() || null);
    i.onkeydown = e => { if(e.key==='Enter') done(i.value.trim() || null); };
    $('#cn',sh).onclick = () => done(null);
  }));
}
function confirmSheet(title, text, btn='מחיקה'){
  return new Promise(res => sheet(`<h2>${esc(title)}</h2><p class="muted">${text}</p><button class="btn danger" id="ok">${btn}</button><button class="btn" id="cn">ביטול</button>`, sh => {
    $('#ok',sh).onclick = () => { closeSheet(); res(true); };
    $('#cn',sh).onclick = () => { closeSheet(); res(false); };
  }));
}

/* ---------- גיליון למשימה יומית משובצת ---------- */
function dailySheet(id){
  const d = S.defs.find(x=>x.id===id), s = slotOf(S.daily, id), v = s.v||0, a = s.assignee, o = other(a);
  sheet(`<h2>${esc(d.name)}</h2><p class="muted" style="margin-top:-6px">משובצת ל${a===S.person?'י':pname(a)}</p>
    <button class="btn primary" id="done">✓ סימון כבוצעה</button>
    <button class="btn" id="move">${o===S.person?'לקחת אליי':`העברה ל${pname(o)}`}</button>
    <button class="btn" id="un">ביטול שיבוץ</button>`, sh => {
    $('#done',sh).onclick = () => { closeSheet(); toggleDaily(id); };
    $('#move',sh).onclick = () => { closeSheet(); assignDaily(id, v, o); };
    $('#un',sh).onclick = () => { closeSheet(); assignDaily(id, v, null); };
