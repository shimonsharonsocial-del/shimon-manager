}

/* ---------- גיליון שיבוץ משימה שבועית: מי → איזה יום → אישור ---------- */
function weeklySheet(id, presetDay){
  const d = S.defs.find(x=>x.id===id), s = slotOf(S.weekly, id), v = s.v||0;
  const scheduled = s.assignee && s.day!=null;
  const nowP = il(now());
  const weekStartedToday = S.weekId === dayIdOf(now());
  let who = s.assignee || S.person;
  let day = scheduled ? s.day : presetDay != null ? presetDay : (weekStartedToday ? 0 : nowP.wd);
  sheet(`<h2>${esc(d.name)}</h2>
    <label class="l">מי מבצע?</label>
    <div class="pick">${['shimon','aviya'].map(p=>`<button data-p="${p}" class="${p}">${p===S.person?`אני (${pname(p)})`:pname(p)}</button>`).join('')}</div>
    <label class="l">באיזה יום?</label>
    <div class="days">${DAY_SHORT.map((n,i)=>`<button data-d="${i}">${n}<small>${dm(weekDate(S.weekId,i))}</small></button>`).join('')}</div>
    <button class="btn primary" id="ok">${scheduled?'שמירת שינויים':'שיבוץ'}</button>
    ${scheduled ? `<button class="btn" id="done">${s.done?'ביטול סימון ביצוע':'✓ סימון כבוצעה'}</button><button class="btn" id="un">ביטול שיבוץ</button>` : ''}`, sh => {
    const draw = () => {
      sh.querySelectorAll('[data-p]').forEach(b => b.classList.toggle('on', b.dataset.p===who));
      sh.querySelectorAll('[data-d]').forEach(b => b.classList.toggle('on', +b.dataset.d===day));
    };
    sh.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { who=b.dataset.p; draw(); });
    sh.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { day=+b.dataset.d; draw(); });
    draw();
    $('#ok',sh).onclick = () => { closeSheet(); slotOp('w', id, v, () => ({assignee:who, day}), scheduled ? 'השיבוץ עודכן' : `שובץ ליום ${DAY_NAMES[day]}`); };
    const dn = $('#done',sh); if(dn) dn.onclick = () => { closeSheet(); toggleWeekly(id); };
    const un = $('#un',sh); if(un) un.onclick = () => { closeSheet(); slotOp('w', id, v, () => ({assignee:null, day:null, done:false, doneBy:null, doneAt:null}), 'השיבוץ בוטל'); };
  });
}

/* ---------- ניהול רשימות המשימות הקבועות ---------- */
function manageDefs(){
  const kind = S.taskTab;
  const title = kind==='daily' ? 'משימות יומיות קבועות' : 'משימות שבועיות קבועות';
  const draw = sh => {
    const defs = S.defs.filter(d=>d.kind===kind && !d.deleted).sort((a,b)=>a.order-b.order);
    $('#mlist',sh).innerHTML = defs.map((d,i) => `<div class="mrow ${d.active?'':'off'}">
      <button class="nm" data-m="rename" data-id="${d.id}">${esc(d.name)}</button>
      ${kind==='weekly' ? `<button class="edit-ic" style="width:auto;padding:0 8px;font-weight:700" data-m="pts" data-id="${d.id}" aria-label="ניקוד">⭐${ptsOf(d)}</button>` : ''}
      <button class="edit-ic" data-m="up" data-id="${d.id}" ${i===0?'disabled':''} aria-label="למעלה">↑</button>
      <button class="edit-ic" data-m="down" data-id="${d.id}" ${i===defs.length-1?'disabled':''} aria-label="למטה">↓</button>
      <button class="switch ${d.active?'on':''}" data-m="active" data-id="${d.id}" aria-label="${d.active?'השבתה':'הפעלה'}"></button>
      <button class="edit-ic" data-m="del" data-id="${d.id}" aria-label="מחיקה">🗑</button></div>`).join('');
  };
  sheet(`<h2>${title}</h2><p class="small muted" style="margin-top:-8px">לחיצה על שם לעריכה · המתג מפעיל או משבית · מחיקה לא מוחקת היסטוריה</p>
    ${kind==='weekly' ? '<p class="small muted" style="margin-top:-4px">⭐ = כמה משימות שווה המשימה בסטטיסטיקה. לחיצה על הכוכב לשינוי.</p>' : ''}
    <div id="mlist"></div><button class="btn primary" id="add">＋ הוספת משימה</button><button class="btn" id="close">סגירה</button>`, sh => {
    draw(sh);
    const redraw = () => { if(document.body.contains(sh)) draw(sh); };
    sh._redraw = redraw;
    $('#close',sh).onclick = () => closeSheet();
    $('#add',sh).onclick = async () => {
      const name = prompt('שם המשימה החדשה'); if(!name || !name.trim()) return;
      const all = S.defs.filter(d=>d.kind===kind);
      if(all.some(d=>!d.deleted && nkey(d.name)===nkey(name))) return toast('כבר יש משימה בשם הזה', true);
      let points;
      if(kind==='weekly'){ points = askPoints(2); if(points == null) return; }
      try{ await B.set(`taskDefs/${B.newId()}`, {name:name.trim(), kind, order:Math.max(0,...all.map(d=>d.order))+1, active:true, createdAt:now(), ...(points!=null?{points}:{})}); toast('המשימה נוספה'); redraw(); }
      catch(e){ toast(errMsg(e), true); }
    };
    $('#mlist',sh).onclick = async e => {
      const b = e.target.closest('[data-m]'); if(!b) return;
      const d = S.defs.find(x=>x.id===b.dataset.id); if(!d) return;
      const list = S.defs.filter(x=>x.kind===kind && !x.deleted).sort((a,b)=>a.order-b.order);
      try{
        if(b.dataset.m==='rename'){ const n = prompt('שם המשימה', d.name); if(n && n.trim() && n.trim()!==d.name) await B.set(`taskDefs/${d.id}`, {name:n.trim()}, true); }
        if(b.dataset.m==='pts'){ const n = askPoints(ptsOf(d)); if(n != null && n !== ptsOf(d)) await B.set(`taskDefs/${d.id}`, {points:n}, true); }
        if(b.dataset.m==='active'){ await B.set(`taskDefs/${d.id}`, {active:!d.active}, true); }
        if(b.dataset.m==='del'){ if(confirm(`למחוק את "${d.name}" מהרשימה? ההיסטוריה שלה תישמר.`)) await B.set(`taskDefs/${d.id}`, {deleted:true, active:false, deletedAt:now()}, true); }
        if(b.dataset.m==='up' || b.dataset.m==='down'){
          const i = list.indexOf(d), j = b.dataset.m==='up' ? i-1 : i+1; if(j<0 || j>=list.length) return;
          await swapOrder('taskDefs', list, i, j);
        }
        redraw();
      }catch(err){ toast(errMsg(err), true); }
    };
  });
}
function askPoints(cur){
  while(true){
    const v = prompt('כמה משימות שווה המשימה הזו? (מספר בין 1 ל־10)', String(cur));
    if(v == null) return null;
    const n = parseInt(String(v).trim(), 10);
    if(n >= 1 && n <= 10) return n;
    alert('צריך מספר שלם בין 1 ל־10');
  }
}
async function swapOrder(colName, list, i, j){
  // מספור מחדש של כל הרשימה אחרי ההחלפה, כדי שלא יהיו שני פריטים עם אותו סדר
  const arr = list.slice(); [arr[i], arr[j]] = [arr[j], arr[i]];
  await B.batch(arr.map((x,k) => ({path:`${colName}/${x.id}`, data:{order:k+1}, merge:true})));
}

/* ---------- ניהול מוצרים וקטגוריות ---------- */
function dupProduct(name, exceptId){ const k = nkey(name); return S.prods.find(p => p.key===k && p.id!==exceptId); }
async function addProduct(name, catId, markMissing){
  name = name.trim(); if(!name) return;
  const dup = dupProduct(name);
  if(dup){ toast(`"${dup.name}" כבר קיים בקטגוריה ${S.cats.find(c=>c.id===dup.categoryId)?.name||''}`, true); return; }
  const id = B.newId();
  const order = Math.max(0, ...S.prods.filter(p=>p.categoryId===catId).map(p=>p.order)) + 1;
  const ops = [{path:`products/${id}`, data:{name, key:nkey(name), categoryId:catId, order}}];
  if(markMissing) ops.push({path:`missing/${id}`, data:{by:S.person, at:now()}});
  try{ await B.batch(ops); toast(markMissing ? `"${name}" נוסף לרשימת הקניות` : `"${name}" נוסף לקטלוג`); }
  catch(e){ toast(errMsg(e), true); }
}
function productSheet(p, newName, newCat){
  const isNew = !p;
  const cats = catsSorted();
  sheet(`<h2>${isNew?'מוצר חדש':'עריכת מוצר'}</h2>
    <label class="l">שם</label><input class="field" id="nm" value="${esc(isNew?newName:p.name)}" autocomplete="off">
    <label class="l">קטגוריה</label><select class="field" id="ct">${cats.map(c=>`<option value="${c.id}" ${(isNew?newCat:p.categoryId)===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
    ${isNew?`<label style="display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:600"><input type="checkbox" id="mm" checked style="width:22px;height:22px"> להוסיף גם לרשימת הקניות</label>`:''}
    <button class="btn primary" id="ok">${isNew?'הוספה':'שמירה'}</button>
    ${isNew?'':'<button class="btn danger" id="del">מחיקת המוצר מהקטלוג</button>'}
    <button class="btn" id="cn">ביטול</button>`, sh => {
    $('#cn',sh).onclick = () => closeSheet();
    $('#ok',sh).onclick = async () => {
      const name = $('#nm',sh).value.trim(), cat = $('#ct',sh).value;
      if(!name) return toast('צריך שם למוצר', true);
      if(isNew){ closeSheet(); S.search=''; const si=$('#search'); if(si) si.value=''; await addProduct(name, cat, $('#mm',sh).checked); return; }
      const dup = dupProduct(name, p.id); if(dup) return toast(`"${dup.name}" כבר קיים בקטלוג`, true);
      closeSheet();
      const patch = {name, key:nkey(name)};
      if(cat !== p.categoryId){ patch.categoryId = cat; patch.order = Math.max(0, ...S.prods.filter(x=>x.categoryId===cat).map(x=>x.order)) + 1; }
      try{ await B.set(`products/${p.id}`, patch, true); toast('נשמר'); }catch(e){ toast(errMsg(e), true); }
    };
    const del = $('#del',sh);
    if(del) del.onclick = async () => {
      closeSheet();
      if(!await confirmSheet('מחיקת מוצר', `למחוק את "${esc(p.name)}" מהקטלוג?`)) return;
      try{ await B.batch([{path:`products/${p.id}`, del:true}, {path:`missing/${p.id}`, del:true}]); toast('המוצר נמחק'); }catch(e){ toast(errMsg(e), true); }
    };
    if(isNew) setTimeout(()=>$('#nm',sh).focus(), 280);
  });
}
function categorySheet(c){
  const n = S.prods.filter(p=>p.categoryId===c.id).length;
  sheet(`<h2>קטגוריה</h2><label class="l">שם</label><input class="field" id="nm" value="${esc(c.name)}">
    <button class="btn primary" id="ok">שמירה</button><button class="btn danger" id="del">מחיקת הקטגוריה</button><button class="btn" id="cn">ביטול</button>`, sh => {
    $('#cn',sh).onclick = () => closeSheet();
    $('#ok',sh).onclick = async () => { const name = $('#nm',sh).value.trim(); if(!name) return;
      if(S.cats.some(x=>x.id!==c.id && nkey(x.name)===nkey(name))) return toast('כבר יש קטגוריה בשם הזה', true);
      closeSheet(); try{ await B.set(`categories/${c.id}`, {name}, true); toast('נשמר'); }catch(e){ toast(errMsg(e), true); } };
    $('#del',sh).onclick = async () => {
      closeSheet();
      if(!await confirmSheet('מחיקת קטגוריה', n ? `למחוק את "${esc(c.name)}"? יימחקו גם <b>${n} המוצרים</b> שבה. אפשר קודם להעביר מוצרים לקטגוריה אחרת.` : `למחוק את "${esc(c.name)}"?`)) return;
      const ops = [{path:`categories/${c.id}`, del:true}];
      S.prods.filter(p=>p.categoryId===c.id).forEach(p => ops.push({path:`products/${p.id}`, del:true}, {path:`missing/${p.id}`, del:true}));
      try{ await B.batch(ops); toast('הקטגוריה נמחקה'); }catch(e){ toast(errMsg(e), true); }
    };
  });
}

/* ---------- סימון חסר / נקנה ---------- */
/* כמות: לכל מוצר חסר, חוץ מירקות ופירות */
const isProduce = p => { const c = S.cats.find(x => x.id === p.categoryId); return p.categoryId === 'c01' || (c && nkey(c.name).startsWith('ירקות')); };
const qtyOf = m => Math.max(1, m?.qty || 1);
async function changeQty(id, delta){
  try{
    await B.tx(`missing/${id}`, cur => {
      if(!cur){ const e = new Error('gone'); e.code = 'gone'; throw e; }
      return {...cur, qty: Math.min(99, Math.max(1, qtyOf(cur) + delta)), qtyBy:S.person};
    });
  }catch(e){ if(e?.code === 'gone') toast('המוצר כבר לא ברשימה', true); else toast(errMsg(e), true); }
}
async function toggleMissing(id){
  const p = S.prods.find(x=>x.id===id); if(!p) return;
  try{
    if(S.missing[id]) await B.del(`missing/${id}`);
    else await B.set(`missing/${id}`, {by:S.person, at:now()});   // מזהה = מזהה המוצר, לכן אין כפילויות ברשימה
  }catch(e){ toast(errMsg(e), true); }
}
async function bought(id){
  const p = S.prods.find(x=>x.id===id); if(!p || leaving.has(id)) return;
  const log = {path:`purchases/${B.newId()}`, data:{productId:id, name:p.name, categoryId:p.categoryId, by:S.person, at:now()}};
  // כמות גדולה מ־1: כל לחיצה על "נקנה" מורידה אחד, והמוצר יורד מהרשימה רק אחרי האחרון
  if(!isProduce(p) && qtyOf(S.missing[id]) > 1){
    try{
      await B.tx(`missing/${id}`, cur => {
        if(!cur || qtyOf(cur) <= 1){ const e = new Error('last'); e.code = 'last'; throw e; }
        return {...cur, qty: qtyOf(cur) - 1, qtyBy:S.person};
      });
      B.set(log.path, log.data).catch(e => console.warn(e));
      return;
    }catch(e){ if(e?.code !== 'last'){ toast(errMsg(e), true); return; } }
  }
  leaving.add(id); paint();
  try{
    await B.batch([{path:`missing/${id}`, del:true}, {path:`purchases/${B.newId()}`, data:{productId:id, name:p.name, categoryId:p.categoryId, by:S.person, at:now()}}]);
  }catch(e){ toast(errMsg(e), true); }
  finally{ setTimeout(()=>{ leaving.delete(id); paint(); }, 260); }
}

/* =====================================================================
   לחיצות
   ===================================================================== */
app.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const id = b.dataset.id, v = b.dataset.v;
  switch(b.dataset.act){
    case 'main': S.main=v; store.set('main',v); paint(); scrollTo(0,0); break;
    case 'taskTab': S.taskTab=v; store.set('taskTab',v); paint(); break;
    case 'shopTab': S.shopTab=v; store.set('shopTab',v); paint(); break;
    case 'filter': S.filter=v; paint(); break;
    case 'day': { const d=+v; S.selDay = d===todayIdx() ? null : d; if(S.taskTab!=='daily'){ S.taskTab='daily'; store.set('taskTab','daily'); } paint(); break; }
    case 'pickWeekly': pickWeeklySheet(+v); break;
    case 'd-assign': assignDaily(id, slotOf(S.daily,id).v||0, b.dataset.p); break;
    case 'd-done': toggleDaily(id); break;
    case 'd-sheet': dailySheet(id); break;
    case 'd-unassign': assignDaily(id, slotOf(S.daily,id).v||0, null); break;
    case 'w-done': toggleWeekly(id); break;
    case 'w-sheet': weeklySheet(id); break;
    case 'manageDefs': manageDefs(); break;
    case 'toggleCat': S.openCat = S.openCat===id ? null : id; S.editCat = null; store.set('openCat', S.openCat); paintCatalog();
      if(S.openCat){ const h = document.querySelector(`[data-act=toggleCat][data-id="${id}"]`); h && h.closest('.cat').scrollIntoView({behavior:'smooth', block:'start'}); } break;
    case 'toggleMiss': toggleMissing(id); break;
    case 'qty': changeQty(id, +v); break;
    case 'bought': bought(id); break;
    case 'editCat': S.editCat = S.editCat===id ? null : id; paintCatalog(); break;
    case 'prodEdit': productSheet(S.prods.find(p=>p.id===id)); break;
    case 'prodAdd': productSheet(null, '', id); break;
    case 'addFromSearch': productSheet(null, S.search.trim(), catsSorted().at(-1)?.id); break;
    case 'catEdit': categorySheet(S.cats.find(c=>c.id===id)); break;
    case 'catUp': case 'catDown': {
      const list = catsSorted(), i = list.findIndex(c=>c.id===id), j = b.dataset.act==='catUp' ? i-1 : i+1;
      if(j>=0 && j<list.length) swapOrder('categories', list, i, j).catch(err=>toast(errMsg(err), true)); break; }
    case 'catAdd': { const name = await askText('קטגוריה חדשה', '', 'הוספה'); if(!name) break;
      if(S.cats.some(c=>nkey(c.name)===nkey(name))) { toast('כבר יש קטגוריה בשם הזה', true); break; }
      try{ await B.set(`categories/${B.newId()}`, {name, order:Math.max(0,...S.cats.map(c=>c.order))+1}); toast('הקטגוריה נוספה'); }catch(err){ toast(errMsg(err), true); } break; }
    case 'menu': menuSheet(); break;
    case 'stats': S.main = S.main==='stats' ? store.get('main','tasks') : 'stats'; paint(); scrollTo(0,0); break;
    case 'month': { const [y,m] = S.statMonth.split('-').map(Number); const t = new Date(Date.UTC(y, m-1+(+v), 1)); S.statMonth = `${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}`; paintStats(); break; }
  }
});

function menuSheet(){
  sheet(`<h2>הגדרות</h2>
    <p class="muted" style="margin-top:-6px">מחובר/ת בתור <b>${pname(S.person)}</b>${S.user?.email && !LOCAL_MODE ? ` · <span dir="ltr">${esc(S.user.email)}</span>` : ''}</p>
    <div class="card" style="box-shadow:none;background:var(--soft)"><b>הוספה למסך הבית</b>
    <div class="small muted" style="margin-top:6px">אייפון: בספארי לוחצים על כפתור השיתוף ⬆︎ ואז "הוספה למסך הבית".<br>אנדרואיד: בכרום לוחצים על ⋮ ואז "התקנת אפליקציה".</div></div>
    <button class="btn danger" id="out">התנתקות</button><button class="btn" id="cn">סגירה</button>
    <p class="small muted" style="text-align:center;margin-top:12px">גרסה ${APP_VERSION}</p>`, sh => {
    $('#cn',sh).onclick = () => closeSheet();
    $('#out',sh).onclick = () => { closeSheet(); B.signOut(); };
  });
}

/* =====================================================================
   כניסה וזיהוי
   ===================================================================== */
function authShell(inner){ shellKey=''; app.innerHTML = `${LOCAL_MODE ? `<div class="test-bar">מצב בדיקה מקומי: עדיין לא מחובר לשרת, הנתונים לא משותפים בין מכשירים</div>` : ''}<div class="auth"><img class="logo" src="icon-192.png" alt=""><h1>הבית שלנו</h1>${inner}</div>`; }

function showLogin(){
  if(LOCAL_MODE){
    authShell(`<p class="muted">מצב בדיקה: בוחרים מי נכנס. כל לשונית בדפדפן מתנהגת כמו מכשיר נפרד.</p>
      <div class="who"><button class="shimon" data-p="shimon">שמעון</button><button class="aviya" data-p="aviya">אביה</button></div>`);
    app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => B.signIn(b.dataset.p));
    return;
  }
  let mode = 'in';
  const draw = () => {
    authShell(`<p class="muted">משימות הבית ורשימת הקניות, משותפות לשמעון ולאביה</p>
      <div class="card">
        <label class="l" style="margin-top:0">אימייל</label><input class="field" id="em" type="email" autocomplete="email" dir="ltr" inputmode="email">
        <label class="l">סיסמה</label><input class="field" id="pw" type="password" autocomplete="${mode==='in'?'current-password':'new-password'}" dir="ltr">
        <div class="err-txt" id="er"></div>
        <button class="btn primary" id="go">${mode==='in'?'כניסה':'יצירת חשבון'}</button>
        <button class="link-btn" id="sw" style="width:100%">${mode==='in'?'פעם ראשונה? יצירת חשבון':'כבר יש לי חשבון, כניסה'}</button>
        ${mode==='in'?'<button class="link-btn" id="fg" style="width:100%;color:var(--muted)">שכחתי סיסמה</button>':''}
      </div>`);
    const er = $('#er');
    $('#sw').onclick = () => { mode = mode==='in'?'up':'in'; draw(); };
    const fg = $('#fg'); if(fg) fg.onclick = async () => { const em=$('#em').value.trim(); if(!em) return er.textContent='כתבו קודם את האימייל';
      try{ await B.resetPassword(em); er.style.color='var(--accent)'; er.textContent='נשלח מייל לאיפוס סיסמה'; }catch(e){ er.textContent=authErr(e); } };
    const go = $('#go');
    const submit = async () => {
      const em = $('#em').value.trim(), pw = $('#pw').value;
      if(!em || !pw) return er.textContent = 'צריך אימייל וסיסמה';
      go.disabled = true; go.textContent = 'רגע…'; er.textContent = '';
      try{ mode==='in' ? await B.signIn(em, pw) : await B.signUp(em, pw); }
      catch(e){ er.textContent = authErr(e); go.disabled = false; go.textContent = mode==='in'?'כניסה':'יצירת חשבון'; }
    };
    go.onclick = submit; $('#pw').onkeydown = e => { if(e.key==='Enter') submit(); };
  };
  draw();
}
function authErr(e){
  const c = e?.code || '';
  if(/invalid-credential|wrong-password|user-not-found/.test(c)) return 'אימייל או סיסמה שגויים';
  if(/email-already-in-use/.test(c)) return 'כבר קיים חשבון עם האימייל הזה. היכנסו במקום.';
  if(/weak-password/.test(c)) return 'הסיסמה צריכה להיות לפחות 6 תווים';
  if(/invalid-email/.test(c)) return 'כתובת האימייל לא תקינה';
  if(/network/.test(c)) return 'אין חיבור לאינטרנט';
  if(/too-many/.test(c)) return 'יותר מדי ניסיונות. נסו שוב בעוד כמה דקות.';
  return 'הכניסה נכשלה. נסו שוב.';
}

function showUnauthorized(){
  unsubs.forEach(f=>f()); periodUnsubs.forEach(f=>f()); unsubs=[]; periodUnsubs=[];
  authShell(`<div class="card"><b>החשבון הזה לא מורשה</b><p class="muted">האפליקציה פתוחה רק לשמעון ולאביה. אם זו טעות, צריך להוסיף את האימייל לרשימת המורשים.</p><button class="btn" id="out">התנתקות</button></div>`);
  $('#out').onclick = () => B.signOut();
}

async function choosePerson(){
  const users = await new Promise(res => { const u = B.watchCol('users', d => { res(d); setTimeout(()=>u&&u()); }, e => { onErr(e); res(null); }); });
  if(users === null) return;
  const taken = Object.fromEntries(users.filter(u=>u.person && u.id!==S.user.uid).map(u=>[u.person,true]));
  authShell(`<p class="muted">פעם אחת בלבד: מי את/ה?</p>
    <div class="who">${['shimon','aviya'].map(p=>`<button class="${p}" data-p="${p}" ${taken[p]?'disabled':''}>${pname(p)}${taken[p]?'<div class="small">כבר נבחר</div>':''}</button>`).join('')}</div>
    <button class="link-btn" id="out" style="margin-top:24px">התנתקות</button>`);
  $('#out').onclick = () => B.signOut();
  app.querySelectorAll('[data-p]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try{ await B.set(`users/${S.user.uid}`, {person:b.dataset.p, email:S.user.email||null, at:now()}, true); start(b.dataset.p); }
    catch(e){ toast(errMsg(e), true); b.disabled = false; }
  });
}

async function start(person){
  S.person = person; S.ready = false; loaded = {}; shellKey = '';
  paint();
  await B.syncClock(S.user.uid);
  try{ await seedIfNeeded(); }catch(e){ console.warn(e); if(e?.code==='permission-denied') return showUnauthorized(); }
  try{ await migrateCatalog2(); }catch(e){ console.warn('catalog2', e); }
  try{ await migrateCatalog3(); }catch(e){ console.warn('catalog3', e); }
  try{ await migrateCatalog4(); }catch(e){ console.warn('catalog4', e); }
  subscribe();
}

/* ---------- הפעלה ---------- */
(async () => {
  try{ B = LOCAL_MODE ? localBackend() : await firebaseBackend(FIREBASE_CONFIG); }
  catch(e){ console.warn(e); authShell(`<div class="card"><b>לא הצלחנו להתחבר</b><p class="muted">בדקו שיש אינטרנט ונסו לרענן.</p></div>`); return; }
  B.onUser(async u => {
    unsubs.forEach(f=>f()); periodUnsubs.forEach(f=>f()); unsubs=[]; periodUnsubs=[];
    S.user = u; S.person = null; S.ready = false; S.dayId = S.weekId = null;
    if(!u) return showLogin();
    if(LOCAL_MODE) return start(u.uid.replace('local-',''));
    let me;
    try{ me = await B.get(`users/${u.uid}`); }
    catch(e){ if(e?.code==='permission-denied') return showUnauthorized(); me = null; }
    if(me?.person) start(me.person); else choosePerson();
  });
  setInterval(() => { if(S.ready) checkPeriod(); }, 20000);
  document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible' && S.ready){ checkPeriod(); paint(); } });
  addEventListener('online', () => S.ready && paint());
  addEventListener('offline', () => S.ready && paint());
  if('serviceWorker' in navigator && location.protocol==='https:'){
    // כשעולה גרסה חדשה: היא נטענת ברקע והאפליקציה מתרעננת לבד פעם אחת
    const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if(hadController && !reloaded && !document.querySelector('.sheet')){ reloaded = true; location.reload(); } });
    navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(reg => {
      const check = () => reg.update().catch(()=>{});
      document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible') check(); });
      setInterval(check, 30*60*1000);
    }).catch(()=>{});
  }
  if(LOCAL_MODE) window.__test = { shiftTo(iso){ testShift = new Date(iso).getTime() - Date.now(); checkPeriod(); }, il, dayIdOf, weekIdOf, B: () => B };
})();
</script>
