<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>המנהל של שמעון</title>
<style>
  :root{
    --bg:#f3f4f9;
    --surface:#ffffff;
    --surface-hover:#eef0f9;
    --text:#161822;
    --text-muted:#6b7089;
    --border:#e6e8f2;
    --primary:#5b63f0;
    --primary-dark:#454ed6;
    --primary-tint:#ecedfe;
    --primary-grad:linear-gradient(135deg,#6d74fb,#4c53e0);
    --danger:#ef4444;
    --danger-tint:#fdeaea;
    --success:#1fb571;
    --success-tint:#e5f8ee;
    --warning:#f2994a;
    --radius:18px;
    --radius-sm:12px;
    --shadow:0 1px 2px rgba(30,32,60,.05), 0 1px 1px rgba(30,32,60,.04);
    --shadow-md:0 14px 30px -8px rgba(30,32,70,.20), 0 4px 10px rgba(30,32,70,.06);
  }
  html.dark{
    --bg:#0f1015;
    --surface:#1b1d27;
    --surface-hover:#252836;
    --text:#eceef5;
    --text-muted:#9498ac;
    --border:#2b2e3d;
    --primary:#7c82ff;
    --primary-dark:#98a0ff;
    --primary-tint:#242a4c;
    --primary-grad:linear-gradient(135deg,#8087ff,#5d63e6);
    --danger:#f27171;
    --danger-tint:#3a2226;
    --success:#3ecf8e;
    --success-tint:#173327;
    --warning:#f4a862;
    --shadow:0 1px 2px rgba(0,0,0,.35);
    --shadow-md:0 16px 34px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  ::selection{background:var(--primary);color:#fff;}
  body{
    margin:0;
    background:
      radial-gradient(900px 420px at 100% -10%, color-mix(in srgb, var(--primary) 8%, transparent), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Helvetica,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .25s ease,color .25s ease;
    overscroll-behavior-y:contain;
  }
  button{font-family:inherit;cursor:pointer;touch-action:manipulation;}
  input,select{font-family:inherit;font-size:16px;}
  #app{
    max-width:960px;margin:0 auto;
    padding:0 16px calc(60px + env(safe-area-inset-bottom)) 16px;
    padding-top:env(safe-area-inset-top);
  }

  @keyframes fadeInUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @keyframes popIn{from{opacity:0;transform:scale(.94) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}

  .topbar{
    display:flex;flex-wrap:wrap;align-items:center;gap:14px;
    padding:22px 0 16px;position:sticky;top:0;z-index:10;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .topbar h1{font-size:21px;margin:0;white-space:nowrap;font-weight:800;letter-spacing:-.01em;}
  .topbar-actions{display:flex;gap:8px;margin-inline-start:auto;align-items:center;}
  .icon-btn{
    border:1px solid var(--border);background:var(--surface);color:var(--text);
    width:44px;height:44px;border-radius:13px;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:var(--shadow);transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
  }
  .icon-btn:hover{background:var(--surface-hover);transform:translateY(-1px);box-shadow:var(--shadow-md);}
  .icon-btn:active{transform:translateY(0);}
  .text-btn{
    border:1px solid var(--border);background:var(--surface);color:var(--text-muted);
    padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;
    transition:transform .15s ease,box-shadow .15s ease,background .15s ease,color .15s ease;
  }
  .text-btn:hover{background:var(--surface-hover);color:var(--text);transform:translateY(-1px);box-shadow:var(--shadow);}
  .text-btn:active{transform:translateY(0);}
  .text-btn.small{padding:5px 11px;font-size:11.5px;}

  h2.section-title{font-size:17px;color:var(--text);margin:20px 0 14px;font-weight:800;letter-spacing:-.01em;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .cat-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 16px 16px;cursor:pointer;box-shadow:var(--shadow);
    transition:transform .16s cubic-bezier(.2,.8,.3,1.2),box-shadow .16s ease,border-color .16s ease;
    position:relative;overflow:hidden;animation:fadeInUp .25s ease;
  }
  .cat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:transparent;}
  .cat-card .bar{position:absolute;top:0;right:0;left:0;height:5px;border-radius:0 0 6px 6px;}
  .cat-card .name{font-weight:800;font-size:15px;margin-top:4px;letter-spacing:-.005em;}
  .cat-card .count{color:var(--text-muted);font-size:12.5px;margin-top:5px;font-weight:600;}
  .cat-card .count.danger{color:var(--danger);}
  .cat-card.add-card{
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;
    border:1.5px dashed var(--border);color:var(--text-muted);background:transparent;box-shadow:none;min-height:84px;
  }
  .cat-card.add-card:hover{background:var(--surface-hover);color:var(--primary);border-color:var(--primary);}
  .cat-card.completed{opacity:.55;}
  .cat-card.completed .name{text-decoration:line-through;}

  .back-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .back-row h2{margin:0;font-size:19px;flex:1;font-weight:800;letter-spacing:-.01em;}

  .task-row{
    display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;
    box-shadow:var(--shadow);transition:box-shadow .15s ease,border-color .15s ease,opacity .15s ease;
    animation:fadeInUp .2s ease;
  }
  .task-row:hover{box-shadow:var(--shadow-md);}
  .task-row.done{opacity:.55;}
  .task-row.done .task-title{text-decoration:line-through;}
  .task-row.colored{color:#fff;border-color:transparent;}
  .task-row.colored .task-title{color:#fff;}
  .task-row.colored .badge.cat,
  .task-row.colored .badge.overdue,
  .task-row.colored .badge.checklist{background:rgba(255,255,255,.28);color:#fff;}
  .task-row.colored .drag-handle{color:rgba(255,255,255,.75);}
  .task-row.colored .row-actions button{color:rgba(255,255,255,.85);}
  .task-row.colored .row-actions button:hover{background:rgba(255,255,255,.18);color:#fff;}
  .task-row.colored .check{border-color:rgba(255,255,255,.65);background:rgba(255,255,255,.18);}
  .check{
    width:27px;height:27px;border-radius:50%;border:2px solid var(--border);background:var(--surface);
    flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;
    transition:transform .15s ease,background .15s ease,border-color .15s ease;
  }
  .check:hover{transform:scale(1.08);border-color:var(--primary);}
  .check.checked{background:var(--success);border-color:var(--success);}
  .task-body{flex:1;min-width:0;}
  .task-title{font-size:14px;font-weight:700;}
  .task-meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;}
  .badge{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;letter-spacing:.01em;}
  .badge.overdue{background:var(--danger-tint);color:var(--danger);}
  .badge.checklist{background:var(--primary-tint);color:var(--primary);cursor:pointer;}

  .checklist-panel{padding:2px 0 8px;display:flex;flex-direction:column;gap:7px;margin-top:-4px;margin-bottom:8px;}
  .checklist-item{display:flex;align-items:center;gap:6px;font-size:13px;padding-inline-end:20px;}
  .checklist-item.dragging{opacity:.45;}
  .checklist-item .done-text{text-decoration:line-through;color:var(--text-muted);}
  .checklist-drag-handle{cursor:grab;touch-action:none;font-size:14px;color:var(--text-muted);background:none;border:none;padding:4px;flex-shrink:0;}
  .checklist-drag-handle:active{cursor:grabbing;}
  .check.small{width:20px;height:20px;font-size:11px;}
  .checklist-edit-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .checklist-edit-row .checklist-edit-input{flex:1;width:auto;}
  .checklist-edit-row button{background:none;border:none;color:var(--danger);font-size:16px;cursor:pointer;padding:6px;flex-shrink:0;}

  .row-actions{display:flex;gap:0;}
  .row-actions button{background:none;border:none;color:var(--text-muted);font-size:15px;padding:9px;min-width:36px;min-height:36px;border-radius:9px;transition:background .15s ease,color .15s ease,transform .15s ease;}
  .row-actions button:hover{background:var(--surface-hover);color:var(--text);transform:scale(1.06);}
  .drag-handle{cursor:grab;touch-action:none;font-size:18px !important;color:var(--text-muted);min-width:36px;min-height:36px;}
  .drag-handle:active{cursor:grabbing;}
  .task-row.dragging{opacity:.45;box-shadow:var(--shadow-md);}

  .day-group{margin-bottom:24px;}
  .day-group-title{font-size:12.5px;font-weight:800;color:var(--text-muted);margin:0 0 10px;text-transform:uppercase;letter-spacing:.03em;}

  .cal-header{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
  .cal-header .month-label{flex:1;text-align:center;font-size:17px;font-weight:800;letter-spacing:-.01em;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:22px;}
  .cal-weekday{text-align:center;font-size:11px;color:var(--text-muted);font-weight:800;padding:4px 0;}
  .cal-day{
    min-width:0;min-height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;background:var(--surface);border:1px solid var(--border);
    transition:transform .12s ease,background .12s ease,box-shadow .12s ease;
  }
  .cal-day:hover{background:var(--surface-hover);transform:translateY(-1px);}
  .cal-day.empty{background:transparent;border:none;cursor:default;}
  .cal-day.empty:hover{transform:none;}
  .cal-day.today{border-color:var(--primary);border-width:2px;font-weight:800;color:var(--primary);}
  .cal-day.selected{background:var(--primary-grad);color:#fff;border-color:transparent;box-shadow:var(--shadow-md);font-weight:800;}
  .cal-day .dot{width:5px;height:5px;border-radius:50%;background:var(--primary);}
  .cal-day.selected .dot{background:#fff;}
  .cal-list-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .cal-list-header h2{margin:0;font-size:14.5px;color:var(--text-muted);flex:1;font-weight:800;text-transform:uppercase;letter-spacing:.02em;}

  .event-row{
    display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);
    transition:box-shadow .15s ease;animation:fadeInUp .2s ease;
  }
  .event-row:hover{box-shadow:var(--shadow-md);}
  .event-body{flex:1;min-width:0;cursor:pointer;}
  .event-title{font-size:14px;font-weight:700;}
  .event-meta{font-size:12px;color:var(--text-muted);margin-top:3px;font-weight:600;}

  .empty{color:var(--text-muted);text-align:center;padding:44px 10px;font-size:14px;line-height:1.7;}

  .add-inline{
    display:flex;align-items:center;gap:8px;justify-content:center;
    border:1.5px dashed var(--border);border-radius:var(--radius-sm);padding:13px;color:var(--text-muted);
    background:transparent;width:100%;font-size:14px;font-weight:700;margin-top:8px;
    transition:background .15s ease,color .15s ease,border-color .15s ease;
  }
  .add-inline:hover{background:var(--surface-hover);color:var(--primary);border-color:var(--primary);}

  .fab-row{display:flex;justify-content:flex-end;margin-top:14px;}
  .btn{border:none;border-radius:12px;padding:11px 20px;font-size:14px;font-weight:800;transition:transform .15s ease,box-shadow .15s ease,filter .15s ease;}
  .btn.small{padding:7px 14px;font-size:12.5px;border-radius:10px;}
  .btn.primary{background:var(--primary-grad);color:#fff;box-shadow:0 6px 16px -4px color-mix(in srgb, var(--primary) 60%, transparent);}
  .btn.primary:hover{filter:brightness(1.06);transform:translateY(-1px);}
  .btn.primary:active{transform:translateY(0);}
  .btn.secondary{background:var(--surface-hover);color:var(--text);}
  .btn.secondary:hover{filter:brightness(.97);}
  .btn.danger{background:var(--danger-tint);color:var(--danger);}
  .btn.danger:hover{filter:brightness(.97);}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(12,12,20,.5);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:100;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  }
  .modal{
    background:var(--surface);border-radius:20px;padding:24px;width:100%;max-width:380px;
    max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    box-shadow:var(--shadow-md);animation:popIn .18s cubic-bezier(.2,.8,.3,1.1) both;
  }
  .modal h2{margin:0 0 18px;font-size:18px;font-weight:800;letter-spacing:-.01em;}
  .modal label{display:block;font-size:12.5px;color:var(--text-muted);margin:14px 0 6px;font-weight:700;}
  .modal input[type=text],.modal input[type=date],.modal input[type=time],.modal input[type=number],.modal select{
    width:100%;padding:12px 13px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;
    transition:border-color .15s ease,box-shadow .15s ease;
  }
  .modal input:focus,.modal select:focus{
    outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent);
  }
  .modal-actions{display:flex;justify-content:space-between;gap:8px;margin-top:24px;}
  .modal-actions .end{display:flex;gap:8px;margin-inline-start:auto;}

  .tabs{
    display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:20px;padding:6px;
    background:var(--surface-hover);border-radius:16px;
  }
  .tabs .tab{padding:8px 2px;font-size:11.5px;border-radius:12px;text-align:center;white-space:normal;line-height:1.3;word-break:break-word;}
  .tab{
    background:none;border:none;padding:9px 14px;font-size:13.5px;font-weight:700;color:var(--text-muted);
    white-space:nowrap;border-radius:999px;transition:background .18s ease,color .18s ease,box-shadow .18s ease;
  }
  .tab.active{color:#fff;background:var(--primary-grad);box-shadow:0 4px 12px -3px color-mix(in srgb, var(--primary) 55%, transparent);}
  .tab:hover:not(.active){color:var(--text);background:color-mix(in srgb, var(--surface) 60%, transparent);}

  .day-nav{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .day-nav .date-label{font-size:16px;font-weight:800;flex:1;text-align:center;min-width:160px;letter-spacing:-.01em;}
  .day-nav input[type=date]{padding:8px 10px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:16px;max-width:132px;}

  .weekday-picker{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .weekday-btn{
    width:36px;height:36px;border-radius:10px;border:1.5px solid var(--border);
    background:var(--surface);color:var(--text-muted);font-size:13px;font-weight:700;cursor:pointer;
  }
  .weekday-btn.active{background:var(--primary-grad);color:#fff;border-color:transparent;}

  .badge.cat{color:#fff;}

  .range-tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .range-tabs .tab{border:1.5px solid var(--border);border-radius:12px;background:var(--surface);}
  .range-tabs .tab.active{background:var(--primary-grad);border-color:transparent;}
  .stat-breakdown{display:flex;flex-direction:column;gap:8px;}
  .stat-row{
    display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:11px 14px;font-size:14px;font-weight:700;box-shadow:var(--shadow);
  }

  .stats-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px;}
  .stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 10px;text-align:center;box-shadow:var(--shadow);}
  .stat-tile-value{font-size:22px;font-weight:800;color:var(--primary);}
  .stat-tile-value.income{color:var(--success);}
  .stat-tile-value.expense{color:var(--danger);}
  .stat-tile-label{font-size:11.5px;color:var(--text-muted);margin-top:6px;font-weight:600;}

  .gauge-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;margin-bottom:20px;box-shadow:var(--shadow);}
  .gauge-header{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:10px;color:var(--text-muted);}
  .gauge-track{height:12px;border-radius:999px;background:var(--surface-hover);overflow:hidden;}
  .gauge-fill{height:100%;background:var(--primary-grad);border-radius:999px;transition:width .3s ease;}
  .gauge-fill.over{background:var(--danger);}

  .water-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:14px;box-shadow:var(--shadow);text-align:center;}
  .water-label{font-size:12px;color:var(--text-muted);font-weight:700;}
  .water-count{font-size:24px;font-weight:800;color:var(--primary);margin:3px 0;}
  .water-btn-row{display:flex;justify-content:center;gap:8px;margin-top:6px;}

  .nutrition-row{
    display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);
    transition:box-shadow .15s ease;animation:fadeInUp .2s ease;
  }
  .nutrition-row:hover{box-shadow:var(--shadow-md);}
  .nutrition-body{flex:1;min-width:0;cursor:pointer;}
  .nutrition-title{font-size:14px;font-weight:700;}
  .nutrition-meta{font-size:12px;color:var(--text-muted);margin-top:3px;font-weight:600;}
  .nutrition-value{font-size:15px;font-weight:800;color:var(--primary);white-space:nowrap;}

  .day-chart{
    display:flex;align-items:flex-end;gap:6px;padding:12px 8px 0;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
    box-shadow:var(--shadow);overflow-x:auto;margin-bottom:18px;
  }
  .day-chart-bar-wrap{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:32px;}
  .day-chart-bar{width:100%;background:var(--primary-grad);border-radius:6px 6px 0 0;min-height:3px;}
  .day-chart-bar.over{background:var(--danger);}
  .day-chart-value{font-size:9px;font-weight:700;color:var(--text);margin-bottom:4px;white-space:nowrap;}
  .day-chart-label{font-size:9px;color:var(--text-muted);margin-top:5px;white-space:nowrap;}

  .photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .photo-thumb{position:relative;border-radius:var(--radius-sm);overflow:hidden;aspect-ratio:1;cursor:pointer;background:var(--surface-hover);box-shadow:var(--shadow);}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-thumb .photo-date{position:absolute;bottom:0;right:0;left:0;background:linear-gradient(to top, rgba(0,0,0,.65), transparent);color:#fff;font-size:10px;font-weight:700;padding:4px 6px 3px;text-align:center;}
  .photo-viewer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;padding:20px;}
  .photo-viewer-overlay img{max-width:100%;max-height:80vh;border-radius:12px;}
  .photo-compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  .photo-compare-grid img{width:100%;border-radius:var(--radius-sm);box-shadow:var(--shadow);}
  .streak-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:18px;text-align:center;margin-bottom:20px;box-shadow:var(--shadow);}
  .streak-card .streak-value{font-size:32px;font-weight:800;color:var(--primary);}
  .streak-card .streak-label{font-size:12px;color:var(--text-muted);margin-top:4px;font-weight:700;}

  .compare-chart{display:flex;flex-direction:column;gap:14px;margin-bottom:12px;}
  .compare-row{display:flex;align-items:center;gap:10px;}
  .compare-label{font-size:13px;font-weight:700;color:var(--text-muted);flex-shrink:0;width:56px;}
  .compare-track{flex:1;height:16px;border-radius:999px;background:var(--surface-hover);overflow:hidden;}
  .compare-fill{height:100%;border-radius:999px;transition:width .3s ease;}
  .compare-fill.income{background:var(--success);}
  .compare-fill.expense{background:var(--danger);}
  .compare-value{font-size:13px;font-weight:700;flex-shrink:0;}

  .finance-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px;}
  .finance-summary .tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 8px;text-align:center;box-shadow:var(--shadow);}
  .finance-summary .tile .label{font-size:11px;color:var(--text-muted);margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
  .finance-summary .tile .value{font-size:16px;font-weight:800;}
  .finance-summary .tile.income .value{color:var(--success);}
  .finance-summary .tile.expense .value{color:var(--danger);}
  .finance-summary .tile.balance .value{color:var(--primary);}
  .finance-summary .tile.credit .value{color:var(--warning);}
  .badge.credit{background:var(--warning);color:#fff;}
  .badge.savings{background:var(--success-tint);color:var(--success);}
  .badge.cash{background:var(--primary-tint);color:var(--primary);}
  .badge.paid{background:var(--success-tint);color:var(--success);}
  .badge.expected{background:var(--surface-hover);color:var(--text-muted);}
  .forecast-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:18px;text-align:center;box-shadow:var(--shadow);}
  .forecast-card .forecast-top{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  .forecast-card .label{font-size:11px;color:var(--text-muted);font-weight:700;letter-spacing:.02em;}
  .forecast-card input[type=date]{width:auto;margin:0;padding:5px 9px;font-size:14px;}
  .forecast-card .value{font-size:22px;font-weight:800;color:var(--primary);margin-bottom:6px;}
  .forecast-card .value.neg{color:var(--danger);}

  .finance-row{
    display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);
    transition:box-shadow .15s ease;animation:fadeInUp .2s ease;
  }
  .finance-row:hover{box-shadow:var(--shadow-md);}
  .finance-body{flex:1;min-width:0;cursor:pointer;}
  .finance-title{font-size:14px;font-weight:700;}
  .finance-meta{font-size:12px;color:var(--text-muted);margin-top:3px;font-weight:600;}
  .finance-amount{font-size:15px;font-weight:800;white-space:nowrap;}
  .finance-amount.income{color:var(--success);}
  .finance-amount.expense{color:var(--danger);}

  .empty:not(.cal-day)::before{content:'✨';display:block;font-size:30px;margin-bottom:10px;}

  .hidden{display:none !important;}
  @media (max-width:480px){
    .topbar h1{display:none;}
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1>🗓️ המנהל של שמעון</h1>
    <div class="topbar-actions">
      <button class="icon-btn" id="themeToggle" onclick="toggleTheme()" title="החלף מצב תצוגה"></button>
      <button class="text-btn" onclick="exportBackup()">גיבוי</button>
      <button class="text-btn" onclick="document.getElementById('restoreInput').click()">שחזור</button>
      <input type="file" id="restoreInput" accept="application/json" class="hidden" onchange="importBackup(event)">
      <input type="file" id="photoFileInput" accept="image/*" class="hidden" onchange="handlePhotoFileSelected(event)">
    </div>
  </header>
  <main id="mainView"></main>
</div>
<div id="modalRoot"></div>

<script>
/* ---------- State ---------- */
const STORAGE_KEY = 'zman-app-data-v1';
const CAT_COLORS = ['#5b8def','#f2994a','#27ae60','#eb5757','#9b51e0','#2d9cdb','#f2c94c','#56ccf2'];
const FINANCE_CATEGORIES = ['הוצאות ובזבוזים','קניות אוכל','אוכל בחוץ','נסיעות','תשלומים','תרומות','חסכונות והשקעות','הכנסות'];
const FINANCE_SAVINGS_SUBCATS = ['חיסכון בבנק','עסק','שוק ההון'];
const FINANCE_INCOME_CATEGORY = 'הכנסות';
const FINANCE_SAVINGS_CATEGORY = 'חסכונות והשקעות';
const FINANCE_CREDIT_SETTLEMENT_CATEGORY = 'עדכון אשראי';
const FINANCE_SAVINGS_ADJUSTMENT_CATEGORY = 'עדכון חיסכון';
const FINANCE_CHECKING_ADJUSTMENT_CATEGORY = 'עדכון עו"ש';
const WORKOUT_TYPES = ['חזה','גב','רגליים','כתפיים','ידיים','פול באדי','אירובי'];
const WORKOUT_CUSTOM = 'מותאם אישית';

function defaultState(){
  return {
    version:1, theme:'light', categories:[], tasks:[], events:[], goals:[], finances:[],
    financeCategories:[...FINANCE_CATEGORIES], recurringTasks:[],
    waterEntries:[], foodEntries:[], calorieTarget:1800, waterTarget:8, googleApiKey:'',
    workouts:[], bodyWeights:[], progressPhotos:[],
    checkingBalanceOffset:0, savingsBalanceOffset:0, cashBalanceOffset:0,
    creditSettings:{ closingDay:15, chargeDay:15 }, recurringFinance:[]
  };
}

/* ---------- Finance schema v2: credit cycles, recurring series, future-dated flows ---------- */
function normalizeFinanceRecord(f){
  return {
    ...f,
    paymentMethod: f.paymentMethod || 'checking',
    creditCharged: !!f.creditCharged,
    fromSavings: !!f.fromSavings,
    isCash: !!f.isCash,
    chargeDate: f.chargeDate || null,
    chargeDateManual: !!f.chargeDateManual,
    chargedAt: f.chargedAt || null,
    recurringId: f.recurringId || null,
    occurrenceDate: f.occurrenceDate || null,
    legacyCounted: !!f.legacyCounted
  };
}
function migrateFinanceSchema(st){
  st.creditSettings = Object.assign({ closingDay:15, chargeDay:15 }, st.creditSettings||{});
  st.recurringFinance = Array.isArray(st.recurringFinance) ? st.recurringFinance : [];
  if((st.financeSchemaVersion||1) < 2){
    // Before v2 every transaction counted toward balances immediately, even future-dated ones.
    // Keep those counted so the balances shown before the upgrade do not move.
    const today = todayStr();
    st.finances.forEach(f=>{ if(f.date > today) f.legacyCounted = true; });
    st.financeSchemaVersion = 2;
  }
}

function migrateBalanceAdjustmentRecords(st){
  let checkingOffset = st.checkingBalanceOffset || 0;
  let savingsOffset = st.savingsBalanceOffset || 0;
  st.finances = (st.finances||[]).filter(f=>{
    if(f.category===FINANCE_CHECKING_ADJUSTMENT_CATEGORY){
      checkingOffset += (f.type==='income' ? f.amount : -f.amount);
      return false;
    }
    if(f.category===FINANCE_SAVINGS_ADJUSTMENT_CATEGORY){
      savingsOffset += (f.type==='expense' ? f.amount : -f.amount);
      return false;
    }
    return true;
  });
  st.checkingBalanceOffset = checkingOffset;
  st.savingsBalanceOffset = savingsOffset;
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){ const fresh = defaultState(); fresh.financeSchemaVersion = 2; return fresh; }
    const parsed = JSON.parse(raw);
    const merged = Object.assign(defaultState(), parsed);
    if(!merged.financeCategories || !merged.financeCategories.length) merged.financeCategories = [...FINANCE_CATEGORIES];
    merged.tasks = (merged.tasks||[]).map((t,i)=>{
      let scope = t.scope || 'today';
      if(scope==='weekly') scope = 'general';
      const date = scope==='today' ? (t.date || t.dueDate || todayStr()) : null;
      const order = t.order!==undefined ? t.order : i;
      const { dueDate, priority, weekOf, ...rest } = t;
      return { ...rest, scope, date, order };
    });
    merged.categories = (merged.categories||[]).map(c=>({ ...c, pinned: !!c.pinned }));
    merged.finances = (merged.finances||[]).map(normalizeFinanceRecord);
    migrateBalanceAdjustmentRecords(merged);
    migrateFinanceSchema(merged);
    return merged;
  }catch(e){
    console.error('Failed to load state', e);
    return defaultState();
  }
}

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = loadState();
let ui = {
  view: 'calendar',
  calendarMonth: todayStr().slice(0,7),
  selectedCalendarDate: null,
  selectedDate: todayStr(),
  selectedCategoryId: null,
  showCompletedGoals: false,
  expandedChecklists: {},
  taskViewMode: 'today',
  selectedNutritionDate: todayStr(),
  statsMode: 'tasks',
  statsTaskCategoryId: null,
  statsNutritionPeriod: 'month',
  statsNutritionMonth: todayStr().slice(0,7),
  financeStatsPeriod: 'month',
  financeStatsMonth: todayStr().slice(0,7),
  financeStatsYear: new Date().getFullYear(),
  financeFilterType: 'all',
  financeSortMode: 'time',
  statsExpandedFinanceCategories: {},
  statsExpandedIncome: false,
  fitnessSubTab: 'workouts',
  comparePhotoA: null,
  comparePhotoB: null
};

/* ---------- Helpers ---------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function todayStr(){ return toDateStr(new Date()); }
function toDateStr(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function formatDateShort(ds){
  if(!ds) return '';
  const [y,m,d] = ds.split('-');
  return `${d}.${m}`;
}
function parseDateStr(ds){
  const [y,m,d] = ds.split('-').map(Number);
  return new Date(y, m-1, d);
}
const WEEKDAY_NAMES = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const WEEKDAY_LETTERS = ['א','ב','ג','ד','ה','ו','ש'];
function formatDateLabel(ds){
  const d = parseDateStr(ds);
  const diffDays = Math.round((d - parseDateStr(todayStr())) / 86400000);
  const weekday = WEEKDAY_NAMES[d.getDay()];
  const dm = formatDateShort(ds);
  if(diffDays===0) return `היום · יום ${weekday}, ${dm}`;
  if(diffDays===1) return `מחר · יום ${weekday}, ${dm}`;
  if(diffDays===-1) return `אתמול · יום ${weekday}, ${dm}`;
  return `יום ${weekday}, ${dm}`;
}
function startOfWeek(d){ const s=new Date(d); s.setDate(d.getDate()-d.getDay()); s.setHours(0,0,0,0); return s; }
function endOfWeek(d){ const s=startOfWeek(d); const e=new Date(s); e.setDate(s.getDate()+6); return e; }
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function endOfMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0); }
const HEBREW_MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
function monthMatrix(yearMonth){
  const [y,m] = yearMonth.split('-').map(Number);
  const startWeekday = new Date(y, m-1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const cells = [];
  for(let i=0;i<startWeekday;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  return cells;
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- Theme ---------- */
function applyTheme(){
  document.documentElement.classList.toggle('dark', state.theme==='dark');
  document.getElementById('themeToggle').textContent = state.theme==='dark' ? '☀️' : '🌙';
}
function toggleTheme(){
  state.theme = state.theme==='dark' ? 'light' : 'dark';
  saveState();
  applyTheme();
}

/* ---------- Modal ---------- */
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
}
function showModal(html){
  document.getElementById('modalRoot').innerHTML =
    `<div class="modal-overlay" onclick="if(event.target===this) closeModal()">
       <div class="modal">${html}</div>
     </div>`;
  const firstInput = document.querySelector('.modal input, .modal select');
  if(firstInput) firstInput.focus();
}
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
document.addEventListener('focusin', e => {
  const el = e.target;
  if(el.closest && el.closest('.modal') && (el.tagName==='INPUT' || el.tagName==='SELECT' || el.tagName==='TEXTAREA')){
    setTimeout(() => el.scrollIntoView({ block:'center', behavior:'smooth' }), 300);
  }
});

let pendingConfirmAction = null;
function showConfirm(message, onConfirm){
  pendingConfirmAction = onConfirm;
  showModal(`
    <h2>אישור פעולה</h2>
    <p style="margin:0 0 20px;color:var(--text);font-size:14px;line-height:1.6;">${escapeHtml(message)}</p>
    <div class="modal-actions">
      <div></div>
      <div class="end">
        <button type="button" class="btn secondary" onclick="closeModal()">ביטול</button>
        <button type="button" class="btn danger" onclick="runConfirmedAction()">אישור</button>
      </div>
    </div>
  `);
}
function runConfirmedAction(){
  const action = pendingConfirmAction;
  pendingConfirmAction = null;
  closeModal();
  if(action) action();
}

/* ---------- View switching ---------- */
function switchView(view){
  ui.view = view;
  render();
}
function shiftDay(delta){
  const d = parseDateStr(ui.selectedDate);
  d.setDate(d.getDate()+delta);
  ui.selectedDate = toDateStr(d);
  render();
}
function goToday(){
  ui.selectedDate = todayStr();
  render();
}
function jumpToDate(val){
  if(!val) return;
  ui.selectedDate = val;
  render();
}
function setTaskViewMode(v){ ui.taskViewMode = v; render(); }
function shiftNutritionDay(delta){
  const d = parseDateStr(ui.selectedNutritionDate);
  d.setDate(d.getDate()+delta);
  ui.selectedNutritionDate = toDateStr(d);
  render();
}
function goNutritionToday(){
  ui.selectedNutritionDate = todayStr();
  render();
}
function jumpNutritionDate(val){
  if(!val) return;
  ui.selectedNutritionDate = val;
  render();
}
function setStatsMode(v){ ui.statsMode = v; render(); }
function setStatsTaskCategory(v){ ui.statsTaskCategoryId = v || null; render(); }
function setNutritionStatsPeriod(v){ ui.statsNutritionPeriod = v; render(); }
function setNutritionStatsMonth(v){ if(!v) return; ui.statsNutritionMonth = v; render(); }
function shiftMonth(delta){
  const [y,m] = ui.calendarMonth.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  ui.calendarMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  render();
}
function selectCalendarDay(dateStr){
  ui.selectedCalendarDate = (ui.selectedCalendarDate===dateStr) ? null : dateStr;
  render();
}
function setFinanceFilter(v){ ui.financeFilterType = v; render(); }
function setFinanceSort(v){ ui.financeSortMode = v; render(); }
function setFinanceStatsPeriod(v){ ui.financeStatsPeriod = v; render(); }
function setFinanceStatsMonth(v){ if(!v) return; ui.financeStatsMonth = v; render(); }
function setFinanceStatsYear(v){ ui.financeStatsYear = Number(v); render(); }
function toggleStatsFinanceCat(cat){
  ui.statsExpandedFinanceCategories = ui.statsExpandedFinanceCategories || {};
  ui.statsExpandedFinanceCategories[cat] = !ui.statsExpandedFinanceCategories[cat];
  render();
}
function toggleStatsIncomeExpand(){
  ui.statsExpandedIncome = !ui.statsExpandedIncome;
  render();
}
function financeYearsList(){
  const years = new Set([new Date().getFullYear()]);
  state.finances.forEach(f=>years.add(Number(f.date.slice(0,4))));
  return Array.from(years).sort((a,b)=>b-a);
}

/* ---------- Categories ---------- */
function openCategoryModal(catId){
  const cat = catId ? state.categories.find(c=>c.id===catId) : null;
  showModal(`
    <h2>${cat ? 'עריכת קטגוריה' : 'קטגוריה חדשה'}</h2>
    <form onsubmit="event.preventDefault(); saveCategoryForm('${catId||''}')">
      <label>שם הקטגוריה</label>
      <input type="text" id="catNameInput" value="${cat?escapeHtml(cat.name):''}" required>
      <label style="display:flex;align-items:center;gap:8px;font-weight:600;margin-top:14px;">
        <input type="checkbox" id="catPinnedInput" ${cat&&cat.pinned?'checked':''} style="width:auto;">
        הצג משימות מהקטגוריה הזו תמיד למעלה
      </label>
      <div class="modal-actions">
        <div>${cat ? `<button type="button" class="btn danger" onclick="deleteCategory('${cat.id}')">מחיקה</button>` : ''}</div>
        <div class="end">
          <button type="button" class="btn secondary" onclick="closeModal()">ביטול</button>
          <button type="submit" class="btn primary">שמירה</button>
        </div>
      </div>
    </form>
  `);
}
function saveCategoryForm(catId){
  const name = document.getElementById('catNameInput').value.trim();
  if(!name) return;
  const pinned = document.getElementById('catPinnedInput').checked;
  if(catId){
    const cat = state.categories.find(c=>c.id===catId);
    cat.name = name;
    cat.pinned = pinned;
  }else{
    state.categories.push({
      id: uid(), name, pinned,
      color: CAT_COLORS[state.categories.length % CAT_COLORS.length]
    });
  }
  saveState();
  closeModal();
  render();
}
function deleteCategory(catId){
  showConfirm('למחוק את הקטגוריה? כל המשימות שבתוכה יימחקו גם הן.', () => {
    state.categories = state.categories.filter(c=>c.id!==catId);
    state.tasks = state.tasks.filter(t=>t.categoryId!==catId);
    saveState();
    ui.selectedCategoryId = null;
    render();
  });
}
function openCategory(catId){
  ui.selectedCategoryId = catId;
  render();
}

/* ---------- Goals ---------- */
function openGoalModal(goalId){
  const goal = goalId ? state.goals.find(g=>g.id===goalId) : null;
  const catOptions = state.categories.map(c=>
    `<option value="${c.id}" ${goal&&goal.categoryId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`
  ).join('');
  showModal(`
    <h2>${goal ? 'עריכת יעד' : 'יעד חדש'}</h2>
    <form onsubmit="event.preventDefault(); saveGoalForm('${goalId||''}')">
      <label>כותרת</label>
      <input type="text" id="goalTitleInput" value="${goal?escapeHtml(goal.title):''}" required>
      <label>קטגוריה</label>
      <select id="goalCatInput">
        <option value="">ללא קטגוריה</option>
        ${catOptions}
      </select>
      <label>כמות יעד</label>
      <input type="number" id="goalCountInput" min="1" value="${goal?goal.targetCount:1}" required>
      <label>דדליין</label>
      <input type="date" id="goalDeadlineInput" value="${goal&&goal.deadline?goal.deadline:''}" required>
      <div class="modal-actions">
        <div>${goal ? `<button type="button" class="btn danger" onclick="deleteGoal('${goal.id}')">מחיקה</button>` : ''}</div>
        <div class="end">
          <button type="button" class="btn secondary" onclick="closeModal()">ביטול</button>
          <button type="submit" class="btn primary">שמירה</button>
        </div>
      </div>
    </form>
  `);
}
function saveGoalForm(goalId){
  const title = document.getElementById('goalTitleInput').value.trim();
  if(!title) return;
  const categoryId = document.getElementById('goalCatInput').value || null;
  const targetCount = Math.max(1, parseInt(document.getElementById('goalCountInput').value, 10) || 1);
  const deadline = document.getElementById('goalDeadlineInput').value;
  if(!deadline) return;
  if(goalId){
    const goal = state.goals.find(g=>g.id===goalId);
    Object.assign(goal, { title, categoryId, targetCount, deadline });
  }else{
    state.goals.push({ id:uid(), title, categoryId, targetCount, deadline, completed:false, completedAt:null, createdAt:Date.now() });
  }
  saveState();
  closeModal();
  render();
}
function deleteGoal(goalId){
  showConfirm('למחוק את היעד? המשימות המשויכות לא יימחקו, אבל השיוך שלהן אליו יוסר.', () => {
    state.goals = state.goals.filter(g=>g.id!==goalId);
    state.tasks.forEach(t=>{ if(t.goalId===goalId) t.goalId=null; });
    saveState();
    render();
  });
}
function toggleGoalCompleted(goalId){
  const goal = state.goals.find(g=>g.id===goalId);
  if(!goal) return;
  goal.completed = !goal.completed;
  goal.completedAt = goal.completed ? Date.now() : null;
  saveState();
  render();
}
function toggleShowCompletedGoals(){
  ui.showCompletedGoals = !ui.showCompletedGoals;
  render();
}

/* ---------- Finances ---------- */
function financeMethodOf(f){
  if(f.isCash) return 'cash';
  return f.paymentMethod==='credit' ? 'credit' : 'checking';
}
function toggleFinanceSubcategory(val){
  const isIncome = val===FINANCE_INCOME_CATEGORY;
  const wrap = document.getElementById('financeSubcatWrap');
  if(wrap) wrap.classList.toggle('hidden', val!==FINANCE_SAVINGS_CATEGORY);
  const creditBtn = document.getElementById('financeMethodCreditBtn');
  if(creditBtn) creditBtn.classList.toggle('hidden', isIncome);
  const methodInput = document.getElementById('financeMethodInput');
  if(methodInput){
    if(isIncome && methodInput.value==='credit') setFinanceMethod('checking');
    else setFinanceMethod(methodInput.value || 'checking');
  }
  const fromSavingsWrap = document.getElementById('financeFromSavingsWrap');
  if(fromSavingsWrap) fromSavingsWrap.classList.toggle('hidden', !isIncome);
  const methodLabel = document.getElementById('financeMethodLabel');
  if(methodLabel) methodLabel.textContent = isIncome ? 'הכסף נכנס ל' : 'אמצעי תשלום';
  const recurLabel = document.getElementById('financeRecurLabel');
  if(recurLabel) recurLabel.textContent = isIncome ? 'הכנסה חוזרת' : 'הוצאה חוזרת';
}
function setFinanceMethod(m){
  const input = document.getElementById('financeMethodInput');
  if(!input) return;
  input.value = m;
  document.querySelectorAll('#financeMethodTabs .tab').forEach(b=>b.classList.toggle('active', b.dataset.m===m));
  updateFinanceChargeVisibility();
  if(m==='credit') autoFillChargeDate(false);
}
function updateFinanceChargeVisibility(){
  const input = document.getElementById('financeMethodInput');
  const recur = document.getElementById('financeRecurInput');
  const wrap = document.getElementById('financeChargeWrap');
  if(!input || !wrap) return;
  wrap.classList.toggle('hidden', input.value!=='credit' || !!(recur && recur.checked));
}
function toggleRecurFields(){
  const recur = document.getElementById('financeRecurInput');
  const fields = document.getElementById('financeRecurFields');
  if(fields) fields.classList.toggle('hidden', !(recur && recur.checked));
  updateFinanceChargeVisibility();
}
function financeChargeHintText(){
  const c = state.creditSettings;

/* ---------- Credit cycle helpers ---------- */
function pad2(n){ return String(n).padStart(2,'0'); }
function daysInMonthOf(y,m){ return new Date(y, m, 0).getDate(); }
function makeDateStr(y,m,d){
  const t = m-1;
  y += Math.floor(t/12);
  m = ((t%12)+12)%12 + 1;
  return `${y}-${pad2(m)}-${pad2(Math.min(d, daysInMonthOf(y,m)))}`;
}
function addDaysStr(ds,n){
  const d = parseDateStr(ds);
  d.setDate(d.getDate()+n);
  return toDateStr(d);
}
function endOfMonthStr(ds){
  const [y,m] = ds.split('-').map(Number);
  return makeDateStr(y, m, 31);
}
// A purchase before the closing day belongs to the cycle closing this month; from the closing day on, to next month's.
// The charge happens on chargeDay of the month the cycle closes in (or the month after, if chargeDay is earlier than closingDay).
function computeCreditChargeDate(ds){
  const { closingDay, chargeDay } = state.creditSettings;
  const [y,m,d] = ds.split('-').map(Number);
  const closing = Math.min(closingDay, daysInMonthOf(y,m));
  let cm = d>=closing ? m+1 : m;
  if(chargeDay < closingDay) cm += 1;
  return makeDateStr(y, cm, chargeDay);
}

/* ---------- Balances ---------- */
// A transaction affects the current balance once its date arrives. Credit purchases are the exception:
// they leave the checking account only when the charge is confirmed.
function isFinanceEffective(f){
  return !!f.legacyCounted || f.date <= todayStr();
}
function checkingBalance(){
  let bal = 0;
  state.finances.forEach(f=>{
    if(f.isCash) return;
    if(f.type==='income'){ if(isFinanceEffective(f)) bal += f.amount; }
    else if(f.paymentMethod==='credit'){ if(f.creditCharged) bal -= f.amount; }
    else if(isFinanceEffective(f)) bal -= f.amount;
  });
  return bal + (state.checkingBalanceOffset||0);
}
function pendingCreditTotal(){
  return state.finances.filter(f=>f.type==='expense' && f.paymentMethod==='credit' && !f.creditCharged).reduce((s,f)=>s+f.amount,0);
}
function savingsBalance(){
  let bal = 0;
  state.finances.forEach(f=>{
    if(!isFinanceEffective(f)) return;
    if(f.type==='expense' && f.category===FINANCE_SAVINGS_CATEGORY) bal += f.amount;
    else if(f.type==='income' && f.fromSavings) bal -= f.amount;
  });
  return bal + (state.savingsBalanceOffset||0);
}

function pendingCreditGroups(){
  const groups = {};
  state.finances.filter(f=>f.type==='expense' && f.paymentMethod==='credit' && !f.creditCharged).forEach(f=>{
    const key = f.chargeDate || 'none';
    (groups[key] = groups[key] || []).push(f);
  });
  return Object.keys(groups).sort((a,b)=> a==='none' ? 1 : (b==='none' ? -1 : (a<b?-1:1))).map(key=>({
    key,
    txs: groups[key].sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0)),
    total: groups[key].reduce((s,f)=>s+f.amount,0)
  }));
}

function updateCreditDiffUI(tracked){
  const actual = parseFloat(document.getElementById('creditActualInput').value);
  const wrap = document.getElementById('creditDiffWrap');
  const text = document.getElementById('creditDiffText');
  const opts = document.getElementById('creditDiffOptions');
  if(isNaN(actual) || Math.abs(actual-tracked)<0.001){ wrap.classList.add('hidden'); return; }
  wrap.classList.remove('hidden');
  const diff = actual - tracked;
  if(diff>0){
    opts.classList.remove('hidden');
    text.textContent = `ירד ${diff.toLocaleString('he-IL',{maximumFractionDigits:2})} ₪ יותר ממה שתועד. מה זה?`;
    const mode = document.querySelector('input[name="creditDiffMode"]:checked').value;
    document.getElementById('creditDiffCatWrap').classList.toggle('hidden', mode!=='expense');
  }else{
    opts.classList.add('hidden');
    text.textContent = `ירד ${(-diff).toLocaleString('he-IL',{maximumFractionDigits:2})} ₪ פחות ממה שתועד. יתרת העו"ש תתוקן בהפרש, וההוצאות שנרשמו נשארות בסטטיסטיקה.`;
  }
}
function confirmCreditGroup(key){
  const group = pendingCreditGroups().find(g=>g.key===key);
  if(!group) return;
  const actual = parseFloat(document.getElementById('creditActualInput').value);
  if(isNaN(actual) || actual<0) return;
  const date = document.getElementById('creditChargedAtInput').value || todayStr();
  group.txs.forEach(f=>{ f.creditCharged = true; f.chargedAt = date; });
  const diff = actual - group.total;
  if(diff > 0.001){
    const modeEl = document.querySelector('input[name="creditDiffMode"]:checked');
    if(modeEl && modeEl.value==='expense'){
      state.finances.push({
        id:uid(), category:document.getElementById('creditDiffCat').value, subCategory:null,
        title:'הפרש חיוב אשראי', amount:diff, type:'expense',
        date, month:date.slice(0,7), paymentMethod:'credit', creditCharged:true, chargedAt:date,
        chargeDate:date, chargeDateManual:true, fromSavings:false, isCash:false,
        recurringId:null, occurrenceDate:null, legacyCounted:false, createdAt:Date.now()
      });
    }else{
      state.checkingBalanceOffset = (state.checkingBalanceOffset||0) - diff;
    }
  }else if(diff < -0.001){
    state.checkingBalanceOffset = (state.checkingBalanceOffset||0) - diff;
  }
  saveState();
  closeModal();
  render();
}

/* ---------- Recurring series (standing orders, subscriptions) ---------- */
const RECUR_FREQ_LABELS = { monthly:'חודשית', weekly:'שבועית', yearly:'שנתית' };
const FINANCE_METHOD_LABELS = { checking:'עו"ש', cash:'מזומן', credit:'אשראי' };
function recurringOccurrences(s, fromStr, toStr){
  const out = [];
  const [sy,sm,sd] = s.startDate.split('-').map(Number);
  for(let n=0; n<5000; n++){
    let ds;
    if(s.frequency==='weekly') ds = addDaysStr(s.startDate, 7*n);
    else if(s.frequency==='yearly') ds = makeDateStr(sy+n, sm, sd);
    else ds = makeDateStr(sy, sm+n, sd);
    if(ds > toStr) break;
    if(s.endDate && ds > s.endDate) break;
    if(ds >= fromStr) out.push(ds);
  }
  return out;
}
function recurringAmountFor(s, ds){
  const o = s.overrides && s.overrides[ds];
  return (o && o.amount!=null) ? o.amount : s.amount;
}
function buildRecurringTx(s, ds){
  const isCredit = s.method==='credit';
  return {
    id:uid(), category:s.category, subCategory:s.subCategory||null, title:s.title,
    amount:recurringAmountFor(s, ds), type:s.type, date:ds, month:ds.slice(0,7),
    paymentMethod:isCredit?'credit':'checking', creditCharged:false, fromSavings:!!s.fromSavings,
    isCash:s.method==='cash', chargeDate:isCredit?computeCreditChargeDate(ds):null, chargeDateManual:false,
    chargedAt:null, recurringId:s.id, occurrenceDate:ds, legacyCounted:false, createdAt:Date.now()
  };
}
// Creates the real transactions for every occurrence whose date has arrived, including ones missed while the app was closed.
// Each occurrence is keyed by (series id, occurrence date), so running this again never duplicates anything.
function processFinanceRecurring(){
  const today = todayStr();
  let changed = false;
  state.recurringFinance.forEach(s=>{
    if(!s.active) return;
    const have = new Set(state.finances.filter(f=>f.recurringId===s.id).map(f=>f.occurrenceDate));
    recurringOccurrences(s, '0000-00-00', today).forEach(ds=>{
      if(have.has(ds) || (s.skipDates||[]).includes(ds)) return;
      state.finances.push(buildRecurringTx(s, ds));
      have.add(ds);
      changed = true;
    });
  });
  return changed;
}
// Occurrences after today that have not become real transactions yet (shown as "expected").
function upcomingRecurring(toStr, includeSkipped){
  const today = todayStr();
  const out = [];
  state.recurringFinance.forEach(s=>{
    if(!s.active) return;
    recurringOccurrences(s, addDaysStr(today,1), toStr).forEach(ds=>{
      const skipped = (s.skipDates||[]).includes(ds);
      if(skipped && !includeSkipped) return;
      if(state.finances.some(f=>f.recurringId===s.id && f.occurrenceDate===ds)) return;
      out.push({ series:s, date:ds, amount:recurringAmountFor(s, ds), skipped });
    });
  });
  return out;
}
function recurringNextDate(s){
  if(!s.active) return null;
  const list = recurringOccurrences(s, addDaysStr(todayStr(),1), makeDateStr(new Date().getFullYear()+3, 12, 31)).filter(ds=>!(s.skipDates||[]).includes(ds));
  return list[0] || null;
}
function recurringScheduleText(s){
  const d = Number(s.startDate.split('-')[2]);
  if(s.frequency==='weekly') return `כל שבוע (${WEEKDAY_NAMES[parseDateStr(s.startDate).getDay()]})`;
  if(s.frequency==='yearly') return `כל שנה ב-${formatDateShort(s.startDate)}`;
  return `כל חודש ב-${d}`;
}
function openRecurringModal(){

  const catOptions = state.financeCategories.map(c=>`<option value="${escapeHtml(c)}" ${s.category===c?'selected':''}>${escapeHtml(c)}</option>`).join('');

function toggleRecurringSkip(id, ds){

/* ---------- Expected balance ---------- */
function computeForecast(horizon){
  const today = todayStr();
  const items = [];
  state.finances.forEach(f=>{
    if(f.isCash) return;
    if(f.type==='income'){
      if(!isFinanceEffective(f) && f.date<=horizon) items.push({ date:f.date, label:f.title, amount:f.amount, kind:'income' });
    }else if(f.paymentMethod==='credit'){
      if(!f.creditCharged && (!f.chargeDate || f.chargeDate<=horizon)){
        items.push({ date:f.chargeDate||null, label:f.title, amount:-f.amount, kind:'credit' });
      }
    }else if(!isFinanceEffective(f) && f.date<=horizon){
      items.push({ date:f.date, label:f.title, amount:-f.amount, kind:'expense' });
    }
  });
  upcomingRecurring(horizon, false).forEach(u=>{
    const s = u.series;
    if(s.method==='cash') return;
    if(s.type==='income'){
      items.push({ date:u.date, label:s.title, amount:u.amount, kind:'income' });
    }else if(s.method==='credit'){
      const cd = computeCreditChargeDate(u.date);
      if(cd<=horizon) items.push({ date:cd, label:s.title, amount:-u.amount, kind:'credit' });
    }else{
      items.push({ date:u.date, label:s.title, amount:-u.amount, kind:'expense' });
    }
  });
  const current = checkingBalance();
  const delta = items.reduce((sum,i)=>sum+i.amount, 0);
  return { current, items, expected: current + delta, horizon };
}
function forecastHorizon(){
  const today = todayStr();
  const v = ui.financeForecastDate;
  return (v && v>=today) ? v : endOfMonthStr(today);
}
function setForecastDate(v){
  if(!v) return;
  ui.financeForecastDate = v;
  render();
}
function openForecastDetail(){
  const fc = computeForecast(forecastHorizon());
  const sorted = [...fc.items].sort((a,b)=> a.date===b.date ? 0 : (a.date===null ? -1 : (b.date===null ? 1 : (a.date<b.date?-1:1))));
  const fmt = n => `${n<0?'-':'+'}${Math.abs(n).toLocaleString('he-IL',{maximumFractionDigits:2})} ₪`;
  const kindLabel = { income:'הכנסה צפויה', expense:'הוצאה צפויה מהעו"ש', credit:'חיוב אשראי צפוי' };
  const rows = sorted.map(i=>`<div class="stat-row" style="font-size:13px;font-weight:600;">
      <span>${i.date ? formatDateShort(i.date) : 'ללא מועד'} · ${escapeHtml(i.label)} <span style="color:var(--text-muted);font-size:11px;">${kindLabel[i.kind]}</span></span>
      <span style="color:${i.amount<0?'var(--danger)':'var(--success)'};">${fmt(i.amount)}</span>
    </div>`).join('') || '<div class="empty">אין תנועות צפויות עד התאריך הזה.</div>';
  const hasUndated = fc.items.some(i=>i.kind==='credit' && !i.date);
  showModal(`
    <h2>יתרה צפויה עד ${formatDateShort(fc.horizon)}.${fc.horizon.slice(0,4)}</h2>
    <div class="stat-breakdown" style="margin-bottom:14px;">
      <div class="stat-row"><span>יתרת עו"ש נוכחית</span><span>${fc.current.toLocaleString('he-IL')} ₪</span></div>
      ${rows}
      <div class="stat-row" style="font-weight:800;"><span>יתרה צפויה</span><span>${fc.expected.toLocaleString('he-IL',{maximumFractionDigits:2})} ₪</span></div>
    </div>
    <p style="margin:0;color:var(--text-muted);font-size:12px;line-height:1.5;">התחזית כוללת הכנסות שתועדו מראש, חיובי אשראי ממתינים, הוראות קבע והוצאות עתידיות מהעו"ש. מזומן לא נכלל.${hasUndated?' עסקאות אשראי ישנות ללא מועד חיוב נכללות כחיוב קרוב.':''}</p>

  `);
}

function saveFinanceForm(txId){
  const category = document.getElementById('financeCatInput').value;
  const subCategory = category===FINANCE_SAVINGS_CATEGORY ? document.getElementById('financeSubcatInput').value : null;
  const title = document.getElementById('financeTitleInput').value.trim();
  if(!title) return;
  const amount = parseFloat(document.getElementById('financeAmountInput').value);
  if(!amount || amount<=0) return;
  const date = document.getElementById('financeDateInput').value || todayStr();
  const type = category===FINANCE_INCOME_CATEGORY ? 'income' : 'expense';
  let method = document.getElementById('financeMethodInput').value || 'checking';
  if(type==='income' && method==='credit') method = 'checking';
  const isCash = method==='cash';
  const paymentMethod = method==='credit' ? 'credit' : 'checking';
  const fromSavingsCheckbox = document.getElementById('financeFromSavingsInput');
  const fromSavings = !!(type==='income' && fromSavingsCheckbox && fromSavingsCheckbox.checked);

  const recurCb = document.getElementById('financeRecurInput');
  if(!txId && recurCb && recurCb.checked){
    const series = {
      id:uid(), title, amount, category, subCategory, type, method, fromSavings,
      frequency:document.getElementById('financeFreqInput').value,
      startDate:date, endDate:document.getElementById('financeEndInput').value || null,
      active:true, skipDates:[], overrides:{}, createdAt:Date.now()
    };
    if(series.endDate && series.endDate < series.startDate){
      alert('תאריך הסיום מוקדם מתאריך ההתחלה.');
      return;
    }
    const pastCount = recurringOccurrences(series, '0000-00-00', todayStr()).length;
    const create = () => {
      state.recurringFinance.push(series);
      processFinanceRecurring();
      saveState();
      closeModal();
      render();
    };
    if(pastCount > 1){
      showConfirm(`תאריך ההתחלה בעבר, ולכן ייווצרו מיד ${pastCount} תנועות מהסדרה וישפיעו על היתרות. להמשיך?`, create);
    }else{
      create();
    }
    return;
  }

  let chargeDate = null, chargeDateManual = false;
  if(method==='credit'){
    const v = document.getElementById('financeChargeDateInput').value;
    if(v){
      chargeDate = v;
      chargeDateManual = !!ui.financeChargeManual;
    }else if(!ui.financeChargeLegacy){
      chargeDate = computeCreditChargeDate(date);
    }
  }
  if(txId){
    const tx = state.finances.find(f=>f.id===txId);
    const wasCredit = tx.paymentMethod==='credit';
    const creditCharged = (wasCredit && paymentMethod==='credit') ? tx.creditCharged : false;
    const chargedAt = creditCharged ? tx.chargedAt : null;
    Object.assign(tx, { category, subCategory, title, amount, type, date, month:date.slice(0,7), paymentMethod, creditCharged, chargedAt, chargeDate, chargeDateManual, fromSavings, isCash, legacyCounted:false });
  }else{
    state.finances.push({ id:uid(), category, subCategory, title, amount, type, date, month:date.slice(0,7), paymentMethod, creditCharged:false, chargedAt:null, chargeDate, chargeDateManual, fromSavings, isCash, recurringId:null, occurrenceDate:null, legacyCounted:false, createdAt:Date.now() });
  }
  saveState();
  closeModal();
  render();
}
function deleteFinance(txId){
  showConfirm('למחוק את התנועה?', () => {
    const tx = state.finances.find(f=>f.id===txId);
    if(tx && tx.recurringId){
      const s = state.recurringFinance.find(x=>x.id===tx.recurringId);
      if(s && tx.occurrenceDate){
        s.skipDates = s.skipDates || [];
        if(!s.skipDates.includes(tx.occurrenceDate)) s.skipDates.push(tx.occurrenceDate);
      }
    }
    state.finances = state.finances.filter(f=>f.id!==txId);
    saveState();

  });
}

async function estimateNutritionAI(foodTitle){
  const response = await fetch(NUTRITION_PROXY_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-goog-api-key': state.googleApiKey
    },
    body: JSON.stringify({
      model: 'gemini-3.7-flash',
      input: `הערך קלוריות וחלבון (בגרם) עבור: ${foodTitle}`,
      tools: [{
        type: 'function',
        name: 'estimate_nutrition',
        description: 'Estimate calories and protein for a food item description',
        parameters: {
          type: 'object',
          properties: {
            calories: { type: 'number', description: 'Estimated total calories for the described portion' },
            protein_grams: { type: 'number', description: 'Estimated protein in grams for the described portion' }
          },
          required: ['calories','protein_grams']
        }
      }],
      generation_config: {
        tool_choice: { allowed_tools: { mode: 'any', tools: ['estimate_nutrition'] } }
      }
    })
  });
  if(!response.ok){
    const errBody = await response.text();
    throw new Error(`שגיאת שרת (${response.status}): ${errBody.slice(0,120)}`);
  }
  const data = await response.json();
  const step = (data.steps||[]).find(s => s.type === 'function_call');
  if(!step) throw new Error('לא התקבלה תשובה תקינה');
  return step.arguments;
}
async function estimateNutritionForForm(){
  const title = document.getElementById('foodTitleInput').value.trim();

}

function compressImage(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('קריאת הקובץ נכשלה'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('טעינת התמונה נכשלה'));
      img.onload = () => {
        const maxDim = 1000;
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function generateRecurringInstances(){

  state.recurringTasks.forEach(rt=>{
    for(let i=0;i<RECURRING_WINDOW_DAYS;i++){
      const d = new Date(today);
      d.setDate(today.getDate()+i);
      if(!rt.weekdays.includes(d.getDay())) continue;
      const dateStr = toDateStr(d);
      const exists = state.tasks.some(t=>t.recurringTaskId===rt.id && t.date===dateStr);
      if(!exists){
        state.tasks.push({
          id:uid(), categoryId:rt.categoryId, title:rt.title, scope:'today',
          date:dateStr, goalId:rt.goalId, recurringTaskId:rt.id,
          done:false, order:Date.now(), createdAt:Date.now()
        });
      }
    }
  });
}

function saveTaskForm(taskId){
  const title = document.getElementById('taskTitleInput').value.trim();
  if(!title) return;
  const categoryId = document.getElementById('taskCatInput').value || null;
  const scope = document.getElementById('taskScopeInput').value;
  const goalId = document.getElementById('taskGoalInput').value || null;
  const existing = taskId ? state.tasks.find(t=>t.id===taskId) : null;

  const repeatCheckbox = document.getElementById('taskRepeatCheckbox');
  if(!existing && repeatCheckbox && repeatCheckbox.checked){
    const weekdays = Array.from(document.querySelectorAll('#taskRepeatDaysWrap .weekday-btn.active')).map(b=>Number(b.dataset.day));
    if(weekdays.length===0){ alert('בחר לפחות יום אחד לחזרה.'); return; }
    state.recurringTasks.push({ id:uid(), title, categoryId, goalId, weekdays, createdAt:Date.now() });
    generateRecurringInstances();
    saveState();
    closeModal();
    render();
    return;
  }

  const date = scope==='today' ? (document.getElementById('taskDateInput').value || todayStr()) : null;

  let checklist = null;
  const checklistCheckbox = document.getElementById('taskChecklistCheckbox');
  if(checklistCheckbox && checklistCheckbox.checked){
    const existingChecklist = (existing && existing.checklist) || [];
    const rows = Array.from(document.querySelectorAll('#taskChecklistItems .checklist-edit-row'));
    checklist = rows.map(row=>{
      const text = row.querySelector('.checklist-edit-input').value.trim();
      if(!text) return null;
      const itemId = row.dataset.itemId;
      const existingItem = itemId ? existingChecklist.find(i=>i.id===itemId) : null;
      return { id: existingItem ? existingItem.id : uid(), title: text, done: existingItem ? existingItem.done : false };
    }).filter(Boolean);
    if(checklist.length===0) checklist = null;
  }
  const done = checklist ? checklist.every(i=>i.done) : (existing ? existing.done : false);

  if(existing){
    Object.assign(existing, { title, categoryId, scope, date, goalId, checklist, done });
  }else{
    state.tasks.push({ id:uid(), categoryId, title, scope, date, goalId, checklist, done, recurringTaskId:null, order:Date.now(), createdAt:Date.now() });
  }
  saveState();
  closeModal();
  render();
}

function toggleTaskDone(taskId){

  if(task.checklist && task.checklist.length){

/* ---------- Drag to reorder ---------- */
let dnd = { active:false, rowEl:null, kind:null };
function dndPointerDown(e){
  const taskHandle = e.target.closest('.drag-handle');
  const checklistHandle = e.target.closest('.checklist-drag-handle');
  if(taskHandle){
    const row = taskHandle.closest('.task-row');
    if(!row) return;
    dnd.active = true;
    dnd.kind = 'task';
    dnd.rowEl = row;
    row.classList.add('dragging');
    e.preventDefault();
  }else if(checklistHandle){
    const row = checklistHandle.closest('.checklist-item');
    if(!row) return;
    dnd.active = true;
    dnd.kind = 'checklist';
    dnd.rowEl = row;
    row.classList.add('dragging');
    e.preventDefault();
  }
}
function dndPointerMove(e){
  if(!dnd.active) return;
  const selector = dnd.kind==='task' ? '.task-row' : '.checklist-item';
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const target = el && el.closest(selector);
  if(!target || target===dnd.rowEl || target.dataset.group!==dnd.rowEl.dataset.group) return;
  const rect = target.getBoundingClientRect();
  const before = (e.clientY - rect.top) < rect.height/2;
  target.parentNode.insertBefore(dnd.rowEl, before ? target : target.nextSibling);
}
function dndPointerUp(){
  if(!dnd.active) return;
  const group = dnd.rowEl.dataset.group;
  const container = dnd.rowEl.parentNode;
  if(dnd.kind==='task'){
    const rows = Array.from(container.querySelectorAll(`.task-row[data-group="${group}"]`));
    rows.forEach((row,i)=>{
      const t = state.tasks.find(x=>x.id===row.dataset.taskId);
      if(t) t.order = i;
    });
  }else if(dnd.kind==='checklist'){
    const taskId = dnd.rowEl.dataset.taskId;
    const task = state.tasks.find(t=>t.id===taskId);
    if(task && task.checklist){
      const rows = Array.from(container.querySelectorAll(`.checklist-item[data-group="${group}"]`));
      const newOrder = rows.map(row=>task.checklist.find(i=>i.id===row.dataset.itemId)).filter(Boolean);
      task.checklist = newOrder;
    }
  }
  dnd.rowEl.classList.remove('dragging');
  dnd.active = false;
  dnd.rowEl = null;
  dnd.kind = null;
  saveState();
  render();
}
document.addEventListener('pointerdown', dndPointerDown);
document.addEventListener('pointermove', dndPointerMove);
document.addEventListener('pointerup', dndPointerUp);
document.addEventListener('pointercancel', dndPointerUp);

/* ---------- Backup / Restore ---------- */
function exportBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `זמן-גיבוי-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function importBackup(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try{
      parsed = JSON.parse(reader.result);
      if(!Array.isArray(parsed.categories) || !Array.isArray(parsed.tasks)){
        throw new Error('invalid format');
      }
    }catch(e){
      alert('הקובץ לא תקין. ודא שבחרת קובץ גיבוי שנוצר על ידי האפליקציה.');
      return;
    }
    showConfirm('שחזור יחליף את כל הנתונים הקיימים באפליקציה בנתונים מהקובץ. להמשיך?', () => {
      state = Object.assign(defaultState(), parsed);
      if(!state.financeCategories || !state.financeCategories.length) state.financeCategories = [...FINANCE_CATEGORIES];
      state.tasks = (state.tasks||[]).map((t,i)=>{
        let scope = t.scope || 'today';
        if(scope==='weekly') scope = 'general';
        const date = scope==='today' ? (t.date || t.dueDate || todayStr()) : null;
        const order = t.order!==undefined ? t.order : i;
        const { dueDate, priority, weekOf, ...rest } = t;
        return { ...rest, scope, date, order };
      });
      state.categories = (state.categories||[]).map(c=>({ ...c, pinned: !!c.pinned }));
      state.finances = (state.finances||[]).map(normalizeFinanceRecord);
      migrateBalanceAdjustmentRecords(state);
      migrateFinanceSchema(state);
      processFinanceRecurring();
      saveState();
      applyTheme();
      ui = {
        view: 'calendar',
        calendarMonth: todayStr().slice(0,7),
        selectedCalendarDate: null,
        selectedDate: todayStr(),
        selectedCategoryId: null,
        showCompletedGoals: false,
        expandedChecklists: {},
        taskViewMode: 'today',
        selectedNutritionDate: todayStr(),
        statsMode: 'tasks',
        statsTaskCategoryId: null,
        statsNutritionPeriod: 'month',
        statsNutritionMonth: todayStr().slice(0,7),
        financeStatsPeriod: 'month',
        financeStatsMonth: todayStr().slice(0,7),
        financeStatsYear: new Date().getFullYear(),
        financeFilterType: 'all',
        financeSortMode: 'time',
        statsExpandedFinanceCategories: {},
        statsExpandedIncome: false
      };
      render();
    });
  };
  reader.readAsText(file);
  event.target.value = '';
}

function renderCalendarView(){

  state.events.forEach(e=>{ (eventsByDate[e.date] = eventsByDate[e.date] || []).push(e); });

  const weekdayHeaders = WEEKDAY_LETTERS.map(w=>`<div class="cal-weekday">${w}</div>`).join('');
  const dayCells = cells.map(dateStr=>{
    if(!dateStr) return `<div class="cal-day empty"></div>`;
    const isToday = dateStr===today;
    const isSelected = dateStr===ui.selectedCalendarDate;
    const hasEvents = (eventsByDate[dateStr]||[]).length>0;
    const dayNum = Number(dateStr.split('-')[2]);
    return `<div class="cal-day ${isToday?'today':''} ${isSelected?'selected':''}" onclick="selectCalendarDay('${dateStr}')">
      <div>${dayNum}</div>
      ${hasEvents ? '<div class="dot"></div>' : ''}

  }else{

    listEvents = state.events.filter(e=>e.date>=today).sort((a,b)=>{
      if(a.date!==b.date) return a.date<b.date?-1:1;
      return (a.time||'99:99').localeCompare(b.time||'99:99');
    });

  let listHtml = listEvents.map(e=>eventRowHtml(e)).join('');

function renderCategoryDetail(catId){
  const cat = state.categories.find(c=>c.id===catId);
  if(!cat){ ui.selectedCategoryId=null; return renderCategoriesView(); }

  const sortByDoneOrder = (a,b)=>{ if(a.done!==b.done) return a.done?1:-1; return a.order-b.order; };

  let extraSections = '';
  const generalTasks = state.tasks.filter(t=>t.categoryId===catId && t.scope==='general').sort(sortByDoneOrder);
  if(generalTasks.length){
    extraSections += `<div class="day-group">
      <div class="day-group-title">כללי</div>
      ${generalTasks.map(t=>taskRowHtml(t)).join('')}
    </div>`;
  }

  const byDate = {};
  state.tasks.filter(t=>t.categoryId===catId && t.scope==='today').forEach(t=>{
    (byDate[t.date] = byDate[t.date] || []).push(t);
  });
  const dates = Object.keys(byDate).sort();
  let sections = dates.map(date=>{
    const tasks = byDate[date].sort(sortByDoneOrder);
    const rows = tasks.map(t=>taskRowHtml(t, {showOverdue:true})).join('');
    return `<div class="day-group">
      <div class="day-group-title">${formatDateLabel(date)}</div>
      ${rows}
    </div>`;
  }).join('');
  if(dates.length===0 && !extraSections){
    sections = `<div class="empty">אין עדיין משימות בקטגוריה הזו.</div>`;
  }
  return `
    <div class="back-row">
      <button class="icon-btn" onclick="ui.selectedCategoryId=null; render();" title="חזרה">→</button>
      <h2>${escapeHtml(cat.name)}</h2>
      <button class="icon-btn" onclick="openCategoryModal('${cat.id}')" title="עריכת קטגוריה">✏️</button>
    </div>
    ${extraSections}
    ${sections}
    <button class="add-inline" onclick="openTaskModal(null, null, '${catId}')">+ משימה חדשה</button>
  `;
}

/* ---------- Render: Goals ---------- */
function goalCardHtml(g){
  const today = todayStr();
  const cat = g.categoryId ? state.categories.find(c=>c.id===g.categoryId) : null;
  const progress = state.tasks.filter(t=>t.goalId===g.id && t.done).length;
  const deadlinePassed = g.deadline && g.deadline<today;
  return `<div class="cat-card ${g.completed?'completed':''}" onclick="openGoalModal('${g.id}')">
    <button class="check ${g.completed?'checked':''}" style="position:absolute;top:12px;left:12px;" onclick="event.stopPropagation(); toggleGoalCompleted('${g.id}')" title="${g.completed?'החזר לפעיל':'סמן כהושלם'}"></button>
    ${cat?`<div class="bar" style="background:${cat.color}"></div>`:''}
    <div class="name">${escapeHtml(g.title)}</div>
    <div class="count">${progress}/${g.targetCount}</div>
    ${cat?`<div class="count">${escapeHtml(cat.name)}</div>`:''}
    ${g.deadline?`<div class="count ${deadlinePassed && !g.completed?'danger':''}">דדליין: ${formatDateShort(g.deadline)}</div>`:''}
  </div>`;
}
function renderGoalsView(){
  if(state.goals.length===0){
    return `<div class="empty">אין עדיין יעדים.<br>לחץ על "יעד חדש" כדי להתחיל.</div>
      <div class="fab-row"><button class="btn primary" onclick="openGoalModal()">+ יעד חדש</button></div>`;
  }
  const weekStart = toDateStr(startOfWeek(new Date()));
  const weekEnd = toDateStr(endOfWeek(new Date()));
  const isThisWeek = d => !!d && d>=weekStart && d<=weekEnd;

  const activeGoals = state.goals.filter(g=>!g.completed).sort((a,b)=>{
    const aWeek = isThisWeek(a.deadline), bWeek = isThisWeek(b.deadline);
    if(aWeek !== bWeek) return aWeek ? -1 : 1;
    if(!a.deadline && !b.deadline) return 0;
    if(!a.deadline) return 1;
    if(!b.deadline) return -1;
    return a.deadline<b.deadline?-1:1;
  });
  const completedGoals = state.goals.filter(g=>g.completed).sort((a,b)=>(b.completedAt||0)-(a.completedAt||0));

  let cards = activeGoals.map(goalCardHtml).join('');
  cards += `<div class="cat-card add-card" onclick="openGoalModal()"><div style="font-size:22px;">+</div><div>יעד חדש</div></div>`;

  let archiveHtml = '';
  if(completedGoals.length){
    archiveHtml = `
      <button class="text-btn" style="margin:20px 0 12px;" onclick="toggleShowCompletedGoals()">
        ${ui.showCompletedGoals?'▲':'▼'} יעדים שהושלמו (${completedGoals.length})
      </button>
      ${ui.showCompletedGoals ? `<div class="grid">${completedGoals.map(goalCardHtml).join('')}</div>` : ''}
    `;
  }

  return `<h2 class="section-title">יעדים</h2><div class="grid">${cards}</div>${archiveHtml}`;
}

function renderStatsView(){

      <button class="tab ${ui.statsMode==='finance'?'active':''}" onclick="setStatsMode('finance')">כספים</button>

function dayChartHtml(dataByDate, overThreshold){
  const dates = Object.keys(dataByDate).sort();
  if(dates.length===0) return `<div class="empty">אין נתונים.</div>`;
  const maxVal = Math.max(...dates.map(d=>dataByDate[d]), 1);
  const bars = dates.map(d=>{
    const val = dataByDate[d];
    const barHeight = Math.max(4, Math.round(val/maxVal*90));
    const isOver = overThreshold!=null && val>overThreshold;
    return `<div class="day-chart-bar-wrap">
      <div class="day-chart-value">${val.toLocaleString('he-IL')}</div>
      <div class="day-chart-bar ${isOver?'over':''}" style="height:${barHeight}px"></div>
      <div class="day-chart-label">${formatDateShort(d)}</div>
    </div>`;
  }).join('');
  return `<div class="day-chart">${bars}</div>`;
}
function renderNutritionStats(){
  const isAll = ui.statsNutritionPeriod==='all';
  const monthKey = ui.statsNutritionMonth;

  const foodInPeriod = isAll ? state.foodEntries : state.foodEntries.filter(f=>f.date.slice(0,7)===monthKey);
  const waterInPeriod = isAll ? state.waterEntries : state.waterEntries.filter(w=>w.date.slice(0,7)===monthKey);

  const foodByDate = {};
  foodInPeriod.forEach(f=>{ foodByDate[f.date] = (foodByDate[f.date]||0) + f.calories; });
  const waterByDate = {};
  waterInPeriod.forEach(w=>{ waterByDate[w.date] = (waterByDate[w.date]||0) + 1; });

  const foodDays = Object.keys(foodByDate);
  const waterDays = Object.keys(waterByDate);

  const avgCalories = foodDays.length>0 ? Math.round(foodInPeriod.reduce((s,f)=>s+f.calories,0)/foodDays.length) : 0;
  const avgWater = waterDays.length>0 ? (waterInPeriod.length/waterDays.length).toFixed(1) : '0';

  const controls = `
    <div class="range-tabs" style="margin-bottom:12px;">
      <button class="tab ${!isAll?'active':''}" onclick="setNutritionStatsPeriod('month')">חודש</button>
      <button class="tab ${isAll?'active':''}" onclick="setNutritionStatsPeriod('all')">הכל</button>
    </div>
    ${!isAll ? `<input type="month" value="${monthKey}" onchange="setNutritionStatsMonth(this.value)" style="padding:9px 13px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:16px;margin-bottom:18px;box-shadow:var(--shadow);">` : ''}
  `;

  if(foodDays.length===0 && waterDays.length===0){
    return `${controls}<div class="empty">אין נתוני תזונה בתקופה זו.</div>`;
  }

  return `
    ${controls}
    <div class="stats-tiles">
      <div class="stat-tile"><div class="stat-tile-value">${avgCalories.toLocaleString('he-IL')}</div><div class="stat-tile-label">ממוצע קלוריות ליום</div></div>
      <div class="stat-tile"><div class="stat-tile-value">${avgWater}</div><div class="stat-tile-label">ממוצע כוסות מים ליום</div></div>
    </div>
    <h2 class="section-title">קלוריות לפי יום</h2>
    ${dayChartHtml(foodByDate, state.calorieTarget)}
    <h2 class="section-title">כוסות מים לפי יום</h2>
    ${dayChartHtml(waterByDate)}
  `;
}

function calcWorkoutStreak(){
  const dates = new Set(state.workouts.map(w=>w.date));
  let d = new Date();
  d.setHours(0,0,0,0);
  if(!dates.has(toDateStr(d))){
    d.setDate(d.getDate()-1);
  }
  let streak = 0;
  while(dates.has(toDateStr(d))){
    streak++;
    d.setDate(d.getDate()-1);
  }
  return streak;
}
