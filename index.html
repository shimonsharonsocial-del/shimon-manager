    <h2 class="section-title">התקדמות משקל</h2>
    ${dayChartHtml(weightByDate)}
    <h2 class="section-title">השוואת תמונות</h2>
    ${photos.length<2 ? `<div class="empty">צריך לפחות שתי תמונות כדי להשוות.</div>` : `
      <div style="display:flex;gap:10px;">
        <select onchange="setComparePhoto('a', this.value)" style="flex:1;padding:9px 13px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:16px;box-shadow:var(--shadow);">
          <option value="">תמונה א'</option>
          ${photoOptionsA}
        </select>
        <select onchange="setComparePhoto('b', this.value)" style="flex:1;padding:9px 13px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:16px;box-shadow:var(--shadow);">
          <option value="">תמונה ב'</option>
          ${photoOptionsB}
        </select>
      </div>
      ${(photoA||photoB) ? `<div class="photo-compare-grid">
        <div>${photoA?`<img src="${photoA.imageDataUrl}"><div style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:4px;">${formatDateShort(photoA.date)}</div>`:''}</div>
        <div>${photoB?`<img src="${photoB.imageDataUrl}"><div style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:4px;">${formatDateShort(photoB.date)}</div>`:''}</div>
      </div>` : ''}
    `}
  `;
}

/* ---------- Main render ---------- */
function renderNavTabs(){
  return `<nav class="tabs">
    <button class="tab ${ui.view==='calendar'?'active':''}" onclick="switchView('calendar')">🗓️ יומן</button>
    <button class="tab ${ui.view==='day'?'active':''}" onclick="switchView('day')">📅 משימות</button>
    <button class="tab ${ui.view==='categories'?'active':''}" onclick="switchView('categories')">📁 קטגוריות</button>
    <button class="tab ${ui.view==='goals'?'active':''}" onclick="switchView('goals')">🎯 יעדים</button>
    <button class="tab ${ui.view==='stats'?'active':''}" onclick="switchView('stats')">📊 סטטיסטיקה</button>
    <button class="tab ${ui.view==='finances'?'active':''}" onclick="switchView('finances')">💰 כספים</button>
    <button class="tab ${ui.view==='nutrition'?'active':''}" onclick="switchView('nutrition')">🥗 תזונה</button>
    <button class="tab ${ui.view==='fitness'?'active':''}" onclick="switchView('fitness')">💪 כושר</button>
  </nav>`;
}
function renderFinancesView(){
  const currentMonth = todayStr().slice(0,7);
  const monthTx = state.finances.filter(f=>f.month===currentMonth);
  // Moving money to/from savings is a transfer, not income or consumer spending.
  const incomeTotal = monthTx.filter(f=>f.type==='income' && !f.fromSavings).reduce((s,f)=>s+f.amount,0);
  const expenseTotal = monthTx.filter(f=>f.type==='expense' && f.category!==FINANCE_CREDIT_SETTLEMENT_CATEGORY && f.category!==FINANCE_SAVINGS_CATEGORY).reduce((s,f)=>s+f.amount,0);

  let list = monthTx.filter(f=> ui.financeFilterType==='all' || f.type===ui.financeFilterType);
  const byDate = (a,b) => a.date!==b.date ? (a.date<b.date?1:-1) : b.createdAt-a.createdAt;
  if(ui.financeSortMode==='category'){
    list = [...list].sort((a,b)=> a.category===b.category ? byDate(a,b) : a.category.localeCompare(b.category,'he'));
  }else{
    list = [...list].sort(byDate);
  }

  let rows = list.map(f=>financeRowHtml(f)).join('');
  if(list.length===0){
    rows = `<div class="empty">אין עדיין תנועות החודש.</div>`;
  }

  const balance = checkingBalance();
  const pendingCredit = pendingCreditTotal();
  const savingsBal = savingsBalance();
  const cashBal = cashBalance();
  const forecast = computeForecast(forecastHorizon());

  return `
    <div style="display:flex;gap:8px;margin-bottom:18px;">
      <button class="btn primary" style="flex:1;" onclick="openFinanceModal()">+ הוספת תנועה</button>
      <button class="icon-btn" onclick="openRecurringModal()" title="הוצאות חוזרות">🔁</button>
      <button class="icon-btn" onclick="openFinanceCategoriesModal()" title="ניהול קטגוריות">✏️</button>
    </div>
    <div class="finance-summary">
      <div class="tile income"><div class="label">הכנסות החודש</div><div class="value">${incomeTotal.toLocaleString('he-IL')} ₪</div></div>
      <div class="tile expense"><div class="label">הוצאות החודש</div><div class="value">${expenseTotal.toLocaleString('he-IL')} ₪</div></div>
      <div class="tile balance">
        <div class="label">יתרת עו"ש</div>
        <div class="value">${balance.toLocaleString('he-IL')} ₪</div>
        <button type="button" class="text-btn small" style="margin-top:6px;" onclick="updateCheckingBalance()">עדכון יתרה</button>
      </div>
      <div class="tile">
        <div class="label">יתרת מזומן</div>
        <div class="value">${cashBal.toLocaleString('he-IL')} ₪</div>
        <button type="button" class="text-btn small" style="margin-top:6px;" onclick="updateCashBalance()">עדכון יתרה</button>
      </div>
      <div class="tile">
        <div class="label">יתרת חיסכון</div>
        <div class="value">${savingsBal.toLocaleString('he-IL')} ₪</div>
        <button type="button" class="text-btn small" style="margin-top:6px;" onclick="updateSavingsBalance()">עדכון יתרה</button>
      </div>
      <div class="tile credit" style="cursor:pointer;" onclick="openCreditPendingModal()">
        <div class="label">אשראי ממתין</div>
        <div class="value">${pendingCredit.toLocaleString('he-IL')} ₪</div>
        <button type="button" class="text-btn small" style="margin-top:6px;" onclick="event.stopPropagation();openCreditPendingModal()">פירוט וחיוב</button>
      </div>
    </div>
    <div class="forecast-card">
      <div class="forecast-top">
        <span class="label">יתרה צפויה בעו"ש עד</span>
        <input type="date" value="${forecast.horizon}" min="${todayStr()}" onchange="setForecastDate(this.value)">
      </div>
      <div class="value ${forecast.expected<0?'neg':''}">${forecast.expected.toLocaleString('he-IL',{maximumFractionDigits:0})} ₪</div>
      <button type="button" class="text-btn small" onclick="openForecastDetail()">איך חושב</button>
    </div>
    <div class="range-tabs" style="margin-bottom:8px;">
      <button class="tab ${ui.financeFilterType==='all'?'active':''}" onclick="setFinanceFilter('all')">הכל</button>
      <button class="tab ${ui.financeFilterType==='income'?'active':''}" onclick="setFinanceFilter('income')">הכנסות</button>
      <button class="tab ${ui.financeFilterType==='expense'?'active':''}" onclick="setFinanceFilter('expense')">הוצאות</button>
    </div>
    <div class="range-tabs" style="margin-bottom:16px;">
      <button class="tab ${ui.financeSortMode==='time'?'active':''}" onclick="setFinanceSort('time')">לפי זמן</button>
      <button class="tab ${ui.financeSortMode==='category'?'active':''}" onclick="setFinanceSort('category')">לפי קטגוריה</button>
    </div>
    ${rows}
  `;
}
function renderNutritionView(){
  const viewDate = ui.selectedNutritionDate;
  const waterToday = state.waterEntries.filter(w=>w.date===viewDate).length;
  const foodToday = state.foodEntries.filter(f=>f.date===viewDate).sort((a,b)=>b.createdAt-a.createdAt);
  const caloriesToday = foodToday.reduce((s,f)=>s+f.calories,0);
  const proteinToday = foodToday.reduce((s,f)=>s+(f.protein||0),0);
  const pct = Math.round(caloriesToday/state.calorieTarget*100);
  const waterPct = Math.round(waterToday/state.waterTarget*100);

  let rows = foodToday.map(f=>`
    <div class="nutrition-row">
      <div class="nutrition-body" onclick="openFoodModal('${f.id}')">
        <div class="nutrition-title">${escapeHtml(f.title)}</div>
        ${f.protein ? `<div class="nutrition-meta">${f.protein.toLocaleString('he-IL')} גרם חלבון</div>` : ''}
      </div>
      <div class="nutrition-value">${f.calories.toLocaleString('he-IL')} קק"ל</div>
      <div class="row-actions">
        <button onclick="openFoodModal('${f.id}')" title="עריכה">✏️</button>
        <button onclick="deleteFoodEntry('${f.id}')" title="מחיקה">🗑️</button>
      </div>
    </div>
  `).join('');
  if(foodToday.length===0){
    rows = `<div class="empty">עדיין לא הוספת אוכל היום.</div>`;
  }

  return `
    <div class="day-nav">
      <button class="text-btn" onclick="shiftNutritionDay(-1)" title="יום קודם">יום קודם</button>
      <div class="date-label">${formatDateLabel(viewDate)}</div>
      <button class="text-btn" onclick="shiftNutritionDay(1)" title="יום הבא">יום הבא</button>
      <button class="text-btn" onclick="goNutritionToday()">היום</button>
      <input type="date" value="${viewDate}" onchange="jumpNutritionDate(this.value)">
    </div>
    <div class="water-card">
      <div class="water-label">💧 מים</div>
      <div class="water-count">${waterToday}</div>
      <div class="water-btn-row">
        <button class="btn primary small" onclick="addWater()">+ כוס מים</button>
        ${waterToday>0 ? `<button class="btn secondary small" onclick="removeLastWater()">− הסר</button>` : ''}
      </div>
      <div class="gauge-track" style="margin-top:10px;"><div class="gauge-fill" style="width:${Math.min(waterPct,100)}%"></div></div>
      <button class="text-btn small" style="margin-top:8px;" onclick="openWaterTargetModal()">${waterToday}/${state.waterTarget} כוסות · ✏️ שנה יעד</button>
    </div>
    <button class="btn primary" style="width:100%;margin-bottom:18px;" onclick="openFoodModal()">+ הוספת אוכל</button>
    <div class="gauge-card">
      <div class="gauge-header">
        <span>קלוריות</span>
        <span>${caloriesToday.toLocaleString('he-IL')} / ${state.calorieTarget.toLocaleString('he-IL')} · ${pct}%</span>
      </div>
      <div class="gauge-track"><div class="gauge-fill ${pct>100?'over':''}" style="width:${Math.min(pct,100)}%"></div></div>
      <button class="text-btn" style="margin-top:12px;" onclick="openCalorieTargetModal()">✏️ שנה יעד יומי</button>
    </div>
    <div class="stats-tiles">
      <div class="stat-tile"><div class="stat-tile-value">${proteinToday.toLocaleString('he-IL')}</div><div class="stat-tile-label">גרם חלבון היום</div></div>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:8px;">
      <button type="button" class="text-btn small" onclick="showAiKeyModal()">🔑 מפתח AI לחישוב אוטומטי</button>
    </div>
    <h2 class="section-title">מה אכלתי</h2>
    ${rows}
  `;
}
function renderFitnessView(){
  const toggle = `
    <div class="range-tabs" style="margin-bottom:18px;">
      <button class="tab ${ui.fitnessSubTab==='workouts'?'active':''}" onclick="setFitnessSubTab('workouts')">אימונים</button>
      <button class="tab ${ui.fitnessSubTab==='weight'?'active':''}" onclick="setFitnessSubTab('weight')">משקל</button>
      <button class="tab ${ui.fitnessSubTab==='photos'?'active':''}" onclick="setFitnessSubTab('photos')">תמונות</button>
    </div>`;
  let body;
  if(ui.fitnessSubTab==='weight') body = renderWeightSection();
  else if(ui.fitnessSubTab==='photos') body = renderPhotosSection();
  else body = renderWorkoutsSection();
  return toggle + body;
}
function renderWorkoutsSection(){
  const workouts = [...state.workouts].sort((a,b)=> a.date<b.date?1:(a.date>b.date?-1:b.createdAt-a.createdAt));
  let rows = workouts.map(w=>workoutRowHtml(w)).join('');
  if(workouts.length===0){
    rows = `<div class="empty">אין עדיין אימונים.</div>`;
  }
  return `
    <button class="btn primary" style="width:100%;margin-bottom:18px;" onclick="openWorkoutModal()">+ אימון חדש</button>
    ${rows}
  `;
}
function renderWeightSection(){
  const weights = [...state.bodyWeights].sort((a,b)=> a.date<b.date?1:(a.date>b.date?-1:b.createdAt-a.createdAt));
  let rows = weights.map(w=>weightRowHtml(w)).join('');
  if(weights.length===0){
    rows = `<div class="empty">אין עדיין נתוני משקל.</div>`;
  }
  return `
    <button class="btn primary" style="width:100%;margin-bottom:18px;" onclick="openWeightModal()">+ עדכון משקל</button>
    ${rows}
  `;
}
function renderPhotosSection(){
  const photos = [...state.progressPhotos].sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:a.createdAt-b.createdAt));
  let grid = photos.map(p=>`
    <div class="photo-thumb" onclick="openPhotoViewer('${p.id}')">
      <img src="${p.imageDataUrl}" loading="lazy">
      <div class="photo-date">${formatDateShort(p.date)}</div>
    </div>
  `).join('');
  if(photos.length===0){
    grid = `<div class="empty">אין עדיין תמונות התקדמות.</div>`;
  }
  return `
    <button class="btn primary" style="width:100%;margin-bottom:18px;" onclick="openPhotoUpload()">+ הוספת תמונה</button>
    <div class="photo-grid">${grid}</div>
  `;
}
function render(){
  const main = document.getElementById('mainView');
  let body;
  if(ui.view==='day') body = renderTasksTab();
  else if(ui.view==='categories') body = renderCategoriesView();
  else if(ui.view==='goals') body = renderGoalsView();
  else if(ui.view==='stats') body = renderStatsView();
  else if(ui.view==='finances') body = renderFinancesView();
  else if(ui.view==='nutrition') body = renderNutritionView();
  else if(ui.view==='fitness') body = renderFitnessView();
  else body = renderCalendarView();
  main.innerHTML = renderNavTabs() + body;
}

/* ---------- Init ---------- */
if(state.recurringTasks.length){
  generateRecurringInstances();
  saveState();
}
if(processFinanceRecurring()) saveState();
applyTheme();
render();
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState==='visible' && processFinanceRecurring()){
    saveState();
    render();
  }
});
</script>
</body>
</html>
